<style>
*{box-sizing:border-box}html,body{margin:0;background:#0d1014;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding-bottom:18px;-webkit-user-select:none}.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px 5px}.top img{width:46px;height:46px}.top h1{font-size:18px;margin:0}.top p{margin:1px 0 0;color:#9da7b3;font-size:11px}
.wrap{width:96%;max-width:820px;margin:auto}.tabs,.tools,.actions{display:grid;gap:6px}.tabs{grid-template-columns:repeat(5,1fr)}.tools{grid-template-columns:repeat(5,1fr);margin-top:6px}.actions{grid-template-columns:repeat(4,1fr);margin-top:6px}.actions button.primary-action{border-color:#5d8fe8;background:#202b3a}.actions button.library-action{background:#163c5f;border-color:#4aa3ff}.actions button.training-action{background:#24533a;border-color:#69d391}.actions button.coach-action{background:#4a315f;border-color:#c28cff}.actions button.save-action{background:#4b401d;border-color:#e5c85c}
button{border:1px solid #343b45;background:#1b2027;color:#fff;border-radius:9px;min-height:42px;font-weight:800;font-size:11px;padding:7px;touch-action:manipulation}button.active{background:#1858b5;border-color:#8ab7ff}button.danger{background:#8e2530}.status{margin:6px 0;background:#151a20;border:1px solid #2c333c;border-radius:8px;padding:7px;text-align:center;font-size:11px;color:#c8d0d9}
#pitch{position:relative;isolation:isolate;width:100%;height:min(72vh,720px);min-height:500px;margin:7px auto;background:#16813a;border:4px solid #fff;border-radius:9px;overflow:hidden;touch-action:none;user-select:none}
.line{position:absolute;pointer-events:none;border-color:#ffffffcc}.half{left:0;right:0;top:50%;border-top:2px solid}.centre{left:50%;top:50%;width:116px;height:116px;border:2px solid;border-radius:50%;transform:translate(-50%,-50%)}.box{left:20%;width:60%;height:17%;border:2px solid}.box.a{top:0}.box.b{bottom:0}.goal{left:38%;width:24%;height:5%;border:2px solid}.goal.a{top:0}.goal.b{bottom:0}
#playersLayer{position:absolute;inset:0;z-index:20;pointer-events:none}.player{position:absolute!important;-webkit-tap-highlight-color:transparent;display:flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto;width:42px;height:58px;border:0;background:transparent!important;align-items:flex-start;justify-content:center;color:#fff;font-weight:900;transform:translate(-50%,-50%);z-index:20;touch-action:none;filter:drop-shadow(0 2px 3px #0009)}.player:before{content:"";position:absolute;top:0;width:16px;height:16px;border:2px solid #fff;border-radius:50%;background:#f0c7a8;z-index:2}.player:after{content:"";position:absolute;top:14px;width:30px;height:30px;border-radius:8px 8px 5px 5px;background:#1d5dbb;border:2px solid #fff;box-shadow:0 17px 0 -7px #111,0 17px 0 -6px #111;z-index:1}.player.gk:after{background:#f2c500}.player.opp:after{background:#c62828}.player.selected{outline:4px solid #ffd84d;outline-offset:3px;border-radius:12px}.player.receiving{outline:4px solid #ffd84d;outline-offset:3px}.player .num{position:relative;z-index:3;margin-top:20px;font-size:12px;text-shadow:0 1px 2px #000}.player .nm{position:absolute;top:58px;pointer-events:none;white-space:nowrap;font-size:10px;text-shadow:0 1px 3px #000;font-weight:800}.opp{z-index:19!important}.opp.press-trigger:after{box-shadow:0 0 0 4px #ff6b73,0 17px 0 -7px #111,0 17px 0 -6px #111}.opp.cover:after{box-shadow:0 0 0 3px #ffb84d,0 17px 0 -7px #111,0 17px 0 -6px #111}.ball{position:absolute;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #111;color:#111;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);z-index:30;font-size:24px;touch-action:none;box-shadow:0 2px 6px #0009}
#svg{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}.run{stroke:#fff;stroke-width:3;stroke-dasharray:9 7;fill:none}.pass{stroke:#ffd84d;stroke-width:3;fill:none}.arrow{marker-end:url(#head)}
.press-key{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:5px;font-size:10px;color:#cbd3dc}.press-key span{padding:4px 7px;border-radius:999px;border:1px solid #39414c;background:#151a20}.press-key .blue{border-color:#4aa3ff}.press-key .red{border-color:#ff6b73}.bottom{margin-top:6px}.panel{margin-top:7px;background:#151a20;border:1px solid #2c333c;border-radius:10px;padding:8px}.panel textarea{width:100%;min-height:70px;border:0;border-radius:7px;padding:9px;font:13px system-ui}.hidden{display:none!important}
.modal{position:fixed;inset:3%;z-index:100;background:#0f1318;border:1px solid #3b434d;border-radius:14px;padding:14px;overflow:auto;text-align:left}.modal h2{margin:0 0 8px}.row{display:flex;gap:7px;align-items:center;justify-content:space-between;margin:7px 0}.row input,.row select{flex:1;min-width:0;padding:9px;border-radius:7px;border:1px solid #3a424c;background:#20262e;color:#fff}
@media(max-width:600px){.tabs{grid-template-columns:repeat(3,1fr)}.tools{grid-template-columns:repeat(3,1fr)}.actions{grid-template-columns:repeat(2,1fr)}#pitch{height:66vh;min-height:500px}.player{width:45px;height:45px}.player .nm{top:43px;font-size:9px}}

<body>
<header class="top"><img src="https://assets.footylogos.com/logos/wealdstone-logo-footylogos.svg" alt="Wealdstone FC" onerror="this.onerror=null;this.src='icon.svg'"><div><h1>WEALDSTONE FC COACH BOARD</h1><p>Professional tactical planning • mobile ready</p></div></header>
<main class="wrap">
<div class="tabs">
<button data-formation="433" class="active">4-3-3</button><button data-formation="442">4-4-2</button><button data-formation="352">3-5-2</button><button data-formation="4231">4-2-3-1</button><button data-formation="4141">4-1-4-1</button>

<div class="actions bottom"><button id="grid">▦ Grid</button><button id="reset">⌂ Reset XI</button><button id="oppClear">✕ Clear Opp</button><button id="freeze">🔒 Freeze</button><button id="rebuild">🔧 Rebuild Board</button></div>
<div class="panel"><textarea id="notes" placeholder="Coach notes — objectives, triggers, details..."></textarea></div>
</main>

<script>
(function(){
"use strict";
const pitch=document.getElementById("pitch"),playersLayer=document.getElementById("playersLayer"),svg=document.getElementById("svg"),ball=document.getElementById("ball"),status=document.getElementById("status"),notes=document.getElementById("notes");
const formations={
"433":[[50,88],[18,72],[38,76],[62,76],[82,72],[30,57],[50,63],[70,57],[18,32],[50,25],[82,32]],
"442":[[50,88],[18,72],[38,76],[62,76],[82,72],[18,52],[38,57],[62,57],[82,52],[35,30],[65,30]],
"352":[[50,88],[25,72],[50,76],[75,72],[15,55],[35,58],[50,52],[65,58],[85,55],[35,30],[65,30]],
"4231":[[50,88],[18,72],[38,76],[62,76],[82,72],[35,58],[65,58],[18,36],[50,42],[82,36],[50,25]],
"4141":[[50,88],[18,72],[38,76],[62,76],[82,72],[50,63],[18,43],[38,48],[62,48],[82,43],[50,25]]
};
let formation="433",tool="select",players=[],opps=[],arrows=[],history=[],redoStack=[],sequence=[],recording=false,playing=false,playIndex=0,raf=0,ballPos={x:50,y:50},frozen=false,returnQueue=[];
let names=Array.from({length:11},(_,i)=>"Player "+(i+1));
const key="wealdstone_pro_coach_v7";
function msg(t){status.textContent=t;status.setAttribute("aria-live","polite")}
function elDown(el,fn){el.addEventListener("pointerdown",fn,{passive:false})}
// ELITE COACHING UX + SAFE INTERACTION LAYER
function stopPlayback(){if(playing){playing=false;cancelAnimationFrame(raf);playing=false;msg("PLAYBACK STOPPED")}}
function clearSelection(){window.passStart=null;players.forEach(p=>p.el.classList.remove("selected"))}
function commitMove(startX,startY,endX,endY,label){const moved=Math.abs(endX-startX)+Math.abs(endY-startY)>0.5;if(!moved){history.pop();return false}persist();msg(label);return true}
function ensureBoardIntegrity(){
  pitch.style.position="relative";
  playersLayer.querySelectorAll(".player").forEach(el=>{el.style.display="flex";el.style.visibility="visible";el.style.opacity="1";el.style.pointerEvents="auto";el.style.zIndex=el.classList.contains("opp")?"19":"20"});
  const domPlayers=[...playersLayer.querySelectorAll(".player:not(.opp)")];
  if(domPlayers.length!==players.length){
    players.forEach(p=>{if(p.el&&p.el.parentNode)p.el.remove()});
    players=[];
    for(let i=0;i<11;i++)createPlayer(i);
  }
  if(!formations[formation]) formation="433";
  playersLayer.querySelectorAll(".player:not(.opp)").forEach(el=>{if(!players.some(p=>p.el===el))el.remove()});
  while(players.length<11)createPlayer(players.length);
  if(players.length>11){players.slice(11).forEach(p=>p.el.remove());players=players.slice(0,11)}
  players.forEach((p,i)=>{
    if(!Number.isFinite(p.x)||!Number.isFinite(p.y)){p.x=formations[formation][i][0];p.y=formations[formation][i][1]}
    if(!p.name)p.name=names[i]||("Player "+(i+1));
    renderPlayer(p);
  });
  if(!Number.isFinite(ballPos.x)||!Number.isFinite(ballPos.y)){ballPos={x:50,y:50}}
  setBall(ballPos.x,ballPos.y);
  ball.style.display="flex";
  draw();
}
function newSession(){stopPlayback();clearSelection();pushHistory();redoStack=[];formation="433";players.forEach((p,i)=>{p.x=formations[formation][i][0];p.y=formations[formation][i][1]});arrows=[];sequence=[];opps.forEach(o=>o.el.remove());opps=[];setBall(50,50);notes.value="";draw();persist();document.querySelectorAll("[data-formation]").forEach(b=>b.classList.toggle("active",b.dataset.formation==="433"));msg("NEW SESSION • 4-3-3 READY")}

function persist(){try{localStorage.setItem(key,JSON.stringify(snapshot()))}catch(_){}}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function posFromEvent(e){const r=pitch.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width*100,1,99),y:clamp((e.clientY-r.top)/r.height*100,1,99)}}
function pushHistory(){history.push(JSON.stringify(snapshot()));redoStack=[];if(history.length>30)history.shift()}
function snapshot(){return{formation,names:names.slice(),players:players.map(p=>({x:p.x,y:p.y})),opps:opps.map(o=>({x:o.x,y:o.y})),arrows:arrows.map(a=>({...a})),ball:{...ballPos},sequence:sequence.map(a=>({...a})),notes:notes.value}}
function flashReceiver(x,y){const p=players.reduce((best,q)=>{const d=Math.hypot(q.x-x,q.y-y);return !best||d<best.d?{p:q,d}:best},null);if(!p||p.d>4)return;const el=p.p.el;el.classList.add("receiving");clearTimeout(el.__receiveTimer);el.__receiveTimer=setTimeout(()=>el.classList.remove("receiving"),500)}
function settleReceiver(x,y){flashReceiver(x,y);}
function renderPlayer(p){if(!p||!p.el)return; p.el.classList.add("player");p.el.style.position="absolute";p.el.style.display="flex";p.el.style.visibility="visible";p.el.style.opacity="1";p.el.style.pointerEvents="auto";p.el.style.left=p.x+"%";p.el.style.top=p.y+"%";p.el.style.zIndex="20";const nm=p.el.querySelector(".nm");if(nm)nm.textContent=p.name}
function createPlayer(i){
 const layer=document.getElementById("playersLayer");
 let el=layer.querySelector('.player[data-player="'+i+'"]');
 if(!el){
  el=document.createElement("div");
  el.className="player"+(i===0?" gk":"");
  el.dataset.player=String(i);
  el.innerHTML='<span class="num">'+(i+1)+'</span><span class="nm"></span>';
  layer.appendChild(el);
 }
 el.classList.add("player");
 if(i===0)el.classList.add("gk");
 const p={i,x:formations[formation][i][0],y:formations[formation][i][1],name:names[i],el};players.push(p);renderPlayer(p);dragPlayer(p)
}
function dragPlayer(p){
  if(p._bound) return;
  p._bound=true;
  p.el.style.touchAction="none";
  p.el.addEventListener("pointerdown",e=>{
    if(frozen)return;
    if(tool==="pass"){selectPassStart(p);return;}
    if(tool!=="select" && tool!=="run")return;
    e.preventDefault();
    e.stopPropagation();
    const startX=p.x,startY=p.y;
    pushHistory();
    let moved=false;
    let active=true;
    const move=ev=>{
      if(!active)return;
      ev.preventDefault();
      const q=posFromEvent(ev);
      p.x=q.x;p.y=q.y;
      if(Math.abs(p.x-startX)+Math.abs(p.y-startY)>1)moved=true;
      renderPlayer(p);
      if(tool==="run" && recording)drawLiveRun(p,startX,startY,p.x,p.y);
    };
    const finish=cancelled=>{
      if(!active)return;
      active=false;
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);
      document.removeEventListener("pointercancel",cancel);
      if(cancelled){
        p.x=startX;p.y=startY;renderPlayer(p);
        history.pop();
        msg("MOVE CANCELLED");
        return;
      }
      if(!moved){history.pop();msg("PLAYER "+(p.i+1)+" SELECTED");return}
      if(tool==="run" && recording)recordRun(p,startX,startY,p.x,p.y);
      persist();
      msg("PLAYER "+(p.i+1)+" MOVED");
    };
    const up=()=>finish(false);
    const cancel=()=>finish(true);
    document.addEventListener("pointermove",move,{passive:false});
    document.addEventListener("pointerup",up,{passive:true});
    document.addEventListener("pointercancel",cancel,{passive:true});
  },{passive:false});
}
function selectPassStart(p){
 if(!window.passStart){window.passStart=p;p.el.classList.add("selected");msg("PASS • "+(p.i+1)+" selected • now tap receiver");return}
 const a=window.passStart,b=p;window.passStart=null;
 players.forEach(x=>x.el.classList.remove("selected"));
 if(a===b){msg("PASS CANCELLED • choose another player");return}
 pushHistory();
 const pass={type:"pass",x1:a.x,y1:a.y,x2:b.x,y2:b.y};
 arrows.push(pass);
 if(recording)sequence.push({...pass});
 draw();persist();
 const sx=a.x,sy=a.y;
 setBall(sx,sy);
 const wasPlaying=playing; playing=true;
 animate(500,t=>setBall(sx+(b.x-sx)*t,sy+(b.y-sy)*t),()=>{
   setBall(b.x,b.y);playing=wasPlaying;
   msg("PASS COMPLETE • "+(a.i+1)+" → "+(b.i+1));
 });
}
function drawLiveRun(p,x1,y1,x2,y2){
 draw();
 if(!recording||tool!=="run")return;
 const l=document.createElementNS("http://www.w3.org/2000/svg","line");
 l.classList.add("dyn","run","arrow","liveRun");
 l.setAttribute("x1",x1*10);l.setAttribute("y1",y1*7);l.setAttribute("x2",x2*10);l.setAttribute("y2",y2*7);
 l.style.color="#fff";svg.appendChild(l);
}
function recordRun(p,x1,y1,x2,y2){
 svg.querySelectorAll(".liveRun").forEach(x=>x.remove());
 if(!p||Math.abs(x1-x2)+Math.abs(y1-y2)<=0.5)return;
 const a={type:"run",i:p.i,x1,y1,x2,y2};
 sequence.push({...a});arrows.push(a);draw();
}
function draw(){
 svg.querySelectorAll(".dyn").forEach(x=>x.remove());
 arrows.forEach(a=>{const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.classList.add("dyn",a.type==="run"?"run":"pass","arrow");l.setAttribute("x1",a.x1*10);l.setAttribute("y1",a.y1*7);l.setAttribute("x2",a.x2*10);l.setAttribute("y2",a.y2*7);l.style.color=a.type==="run"?"#fff":"#ffd84d";svg.appendChild(l)})
}
function setBall(x,y){ballPos={x:clamp(Number(x)||50,1,99),y:clamp(Number(y)||50,1,99)};ball.style.left=ballPos.x+"%";ball.style.top=ballPos.y+"%";ball.style.display="flex";}
elDown(ball,e=>{
 if(frozen||tool!=="ball")return;e.preventDefault();
 pushHistory();try{ball.setPointerCapture(e.pointerId)}catch(_){}
 const startBall={...ballPos};let active=true;
 const move=ev=>{if(!active)return;ev.preventDefault();const q=posFromEvent(ev);setBall(q.x,q.y)};
 const finish=cancelled=>{if(!active)return;active=false;ball.removeEventListener("pointermove",move);ball.removeEventListener("pointerup",up);ball.removeEventListener("pointercancel",cancel);
   if(cancelled){setBall(startBall.x,startBall.y);history.pop();msg("BALL MOVE CANCELLED");return}
   const moved=Math.abs(ballPos.x-startBall.x)+Math.abs(ballPos.y-startBall.y)>0.5;
   if(!moved){history.pop();msg("BALL SELECTED");return}
   if(recording)sequence.push({type:"ball",x:ballPos.x,y:ballPos.y});
   persist();msg("BALL POSITIONED");
 };
 const up=()=>finish(false),cancel=()=>finish(true);
 ball.addEventListener("pointermove",move,{passive:false});ball.addEventListener("pointerup",up,{passive:true});ball.addEventListener("pointercancel",cancel,{passive:true});
});
function setFormation(f){pushHistory();formation=f;players.forEach((p,i)=>{p.x=formations[f][i][0];p.y=formations[f][i][1];renderPlayer(p)});document.querySelectorAll("[data-formation]").forEach(b=>b.classList.toggle("active",b.dataset.formation===f));draw();persist();msg("FORMATION • "+f)}
function setTool(t){tool=t;window.passStart=null;players.forEach(p=>p.el.classList.remove("selected"));document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));const status={select:"SELECT MODE • drag players",pass:"PASS MODE • tap passer then receiver",run:"RUN MODE • drag players • press Record to capture",ball:"BALL MODE • drag the ball",opp:"OPP MODE • tap pitch to add opponents"};msg(status[t]||status.select)}
function addOpp(){if(frozen)return;const n=opps.length;const el=document.createElement("div");el.className="player opp";el.textContent="O";pitch.appendChild(el);const o={x:72-(n%4)*8,y:25+Math.floor(n/4)*18,el};opps.push(o);renderOpp(o);elDown(el,e=>{if(frozen)return;e.preventDefault();const startX=o.x,startY=o.y;let moved=false;try{el.setPointerCapture(e.pointerId)}catch(_){}const move=ev=>{const q=posFromEvent(ev);o.x=q.x;o.y=q.y;if(Math.abs(o.x-startX)+Math.abs(o.y-startY)>0.5)moved=true;renderOpp(o)};const up=()=>{el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);if(!moved)msg("OPPONENT SELECTED");else persist();msg(moved?"OPPONENT POSITIONED":"OPPONENT SELECTED")};el.addEventListener("pointermove",move);el.addEventListener("pointerup",up)});persist();msg("OPPONENT ADDED • drag to position")}
function renderOpp(o){o.el.classList.add("player","opp");o.el.style.position="absolute";o.el.style.display="flex";o.el.style.visibility="visible";o.el.style.opacity="1";o.el.style.pointerEvents="auto";o.el.style.zIndex="19";o.el.style.left=o.x+"%";o.el.style.top=o.y+"%";if(!o.el.dataset.label)o.el.dataset.label="PRESS";o.el.setAttribute("aria-label","Opposition "+o.el.dataset.label)}
function clearOpp(silent=false){if(!opps.length)return;if(!silent)pushHistory();opps.forEach(o=>o.el.remove());opps=[];if(!silent){persist();msg("OPPOSITION CLEARED")}}
function reset(){pushHistory();players.forEach((p,i)=>{p.x=formations[formation][i][0];p.y=formations[formation][i][1];renderPlayer(p)});arrows=[];sequence=[];setBall(50,50);draw();persist();msg("XI RESET • "+formation)}

function undo(){if(!history.length){msg("NOTHING TO UNDO");return}redoStack.push(JSON.stringify(snapshot()));const s=JSON.parse(history.pop());restore(s);persist();msg("UNDO COMPLETE")}
function redo(){if(!redoStack.length){msg("NOTHING TO REDO");return}history.push(JSON.stringify(snapshot()));const s=JSON.parse(redoStack.pop());restore(s);persist();msg("REDO COMPLETE")}
function restore(s){
  if(!s||typeof s!=="object")throw new Error("Invalid session");
  formation=formations[s.formation]?s.formation:"433";
  names=Array.isArray(s.names)&&s.names.length>=11?s.names.slice(0,11):Array.from({length:11},(_,i)=>"Player "+(i+1));
  while(players.length<11)createPlayer(players.length);
  players.forEach((p,i)=>{
    const q=Array.isArray(s.players)&&s.players[i]?s.players[i]:formations[formation][i];
    p.x=Number.isFinite(q.x)?clamp(q.x,1,99):formations[formation][i][0];
    p.y=Number.isFinite(q.y)?clamp(q.y,1,99):formations[formation][i][1];
    p.name=names[i]||("Player "+(i+1));
    renderPlayer(p);
  });
  clearOpp(true);
  if(Array.isArray(s.opps))s.opps.slice(0,20).forEach(o=>{
    if(Number.isFinite(o.x)&&Number.isFinite(o.y)){addOppAt(clamp(o.x,1,99),clamp(o.y,1,99),true);}
  });
  arrows=Array.isArray(s.arrows)?s.arrows.filter(a=>a&&["pass","run"].includes(a.type)&&Number.isFinite(a.x1)&&Number.isFinite(a.y1)&&Number.isFinite(a.x2)&&Number.isFinite(a.y2)).map(a=>({...a})):[]; 
  sequence=Array.isArray(s.sequence)?s.sequence.filter(a=>a&&["pass","run","ball"].includes(a.type)).map(a=>({...a})):[]; 
  const bx=s.ball&&Number.isFinite(s.ball.x)?clamp(s.ball.x,1,99):50;
  const by=s.ball&&Number.isFinite(s.ball.y)?clamp(s.ball.y,1,99):50;
  setBall(bx,by);
  notes.value=typeof s.notes==="string"?s.notes:"";
  draw();
  document.querySelectorAll("[data-formation]").forEach(b=>b.classList.toggle("active",b.dataset.formation===formation));
}
function startRec(){if(playing){playing=false;cancelAnimationFrame(raf)};recording=true;sequence=[];msg("RECORDING • drag players for runs or add passes")}
function stopRec(){recording=false;svg.querySelectorAll(".liveRun").forEach(x=>x.remove());stopPlayback();persist();msg("STOPPED • "+sequence.length+" actions")}
function firstPlaybackBall(){
 for(const a of sequence){
  if(a.type==="pass" && Number.isFinite(a.x1)&&Number.isFinite(a.y1))return{x:a.x1,y:a.y1};
  if(a.type==="ball" && Number.isFinite(a.x)&&Number.isFinite(a.y))return{x:a.x,y:a.y};
 }
 return{x:50,y:50};
}
function play(){
 ensureBoardIntegrity();
 if(!sequence.length){msg("NO RECORDED PLAY");return}
 if(playing){playing=false;cancelAnimationFrame(raf);msg("PLAY PAUSED • tap Play to resume");return}
 if(playIndex>=sequence.length){playIndex=0}
 playing=true;
 if(playIndex===0){returnQueue=[];const b=firstPlaybackBall();setBall(b.x,b.y)}
 msg("PLAYING • "+(playIndex+1)+"/"+sequence.length);
 runStep()
}
function finishQueuedReturns(done){
 if(!returnQueue.length){done();return}
 const q=returnQueue.shift();
 animate(300,t=>{
  q.p.x=q.targetX+(q.homeX-q.targetX)*t;
  q.p.y=q.targetY+(q.homeY-q.targetY)*t;
  renderPlayer(q.p);
 },()=>finishQueuedReturns(done));
}
function reactPress(x,y){
 if(!opps.length)return;
 opps.forEach(o=>{o.el.classList.remove("press-trigger","cover");o.el.dataset.label="PRESS"});
 const ranked=opps.map((o,i)=>({o,i,d:Math.hypot(x-o.x,y-o.y)})).sort((a,b)=>a.d-b.d);
 const first=ranked[0],second=ranked[1],third=ranked[2];
 if(first){
  first.o.el.classList.add("press-trigger");first.o.el.dataset.label="PRESS TRIGGER";
  const f=clamp((30-first.d)/30*0.34,0.08,0.34);
  first.o.x=clamp(first.o.x+(x-first.o.x)*f,2,98);first.o.y=clamp(first.o.y+(y-first.o.y)*f,2,98);renderOpp(first.o);
 }
 if(second){
  second.o.el.classList.add("cover");second.o.el.dataset.label="COVER";
  const dx=first?first.o.x-x:0,dy=first?first.o.y-y:0,len=Math.hypot(dx,dy)||1;
  const coverX=x+(dx/len)*7,coverY=y+(dy/len)*7;
  second.o.x=clamp(second.o.x+(coverX-second.o.x)*0.16,2,98);second.o.y=clamp(second.o.y+(coverY-second.o.y)*0.16,2,98);renderOpp(second.o);
 }
 if(third){
  const squeezeX=x+(third.o.x<x?-4:4),squeezeY=third.o.y+(y-third.o.y)*0.12;
  third.o.x=clamp(third.o.x+(squeezeX-third.o.x)*0.10,2,98);third.o.y=clamp(third.o.y+squeezeY-third.o.y,2,98);renderOpp(third.o);
 }
}
function runStep(){
 if(!playing)return;
 if(playIndex>=sequence.length){
  finishQueuedReturns(()=>{
   playing=false;persist();msg("PLAY COMPLETE • "+sequence.length+" actions");playIndex=0;
  });
  return;
 }
 const a=sequence[playIndex];
 msg("PLAYING • "+(playIndex+1)+"/"+sequence.length);
 if(a.type==="run"){
  const p=players[a.i];
  if(p){
   const homeX=Number.isFinite(p.x)?p.x:a.x1;
   const homeY=Number.isFinite(p.y)?p.y:a.y1;
   const targetX=Number.isFinite(a.x2)?a.x2:homeX;
   const targetY=Number.isFinite(a.y2)?a.y2:homeY;
   const following=sequence[playIndex+1];
   const holdsForNext=following&&following.type==="pass"&&Math.hypot((following.x1||0)-targetX,(following.y1||0)-targetY)<2.5;
   animate(650,t=>{
    p.x=homeX+(targetX-homeX)*t;
    p.y=homeY+(targetY-homeY)*t;
    renderPlayer(p);
   },()=>{
    if(holdsForNext){
     returnQueue.push({p,homeX,homeY,targetX,targetY});
     next();
    }else{
     animate(350,t=>{
      p.x=targetX+(homeX-targetX)*t;
      p.y=targetY+(homeY-targetY)*t;
      renderPlayer(p);
     },next);
    }
   });
  }else next();
 }else if(a.type==="pass"){
  const sx=Number.isFinite(a.x1)?a.x1:ballPos.x;
  const sy=Number.isFinite(a.y1)?a.y1:ballPos.y;
  const ex=Number.isFinite(a.x2)?a.x2:sx;
  const ey=Number.isFinite(a.y2)?a.y2:sy;
  setBall(sx,sy);
  animate(550,t=>setBall(sx+(ex-sx)*t,sy+(ey-sy)*t),()=>{
   setBall(ex,ey);
   settleReceiver(ex,ey);
   reactPress(ex,ey);
   msg("PRESS REACTION • trigger + cover + squeeze");
   finishQueuedReturns(next);
  });
 }else if(a.type==="ball"){
  const sx=ballPos.x,sy=ballPos.y;
  const ex=Number.isFinite(a.x)?a.x:sx;
  const ey=Number.isFinite(a.y)?a.y:sy;
  animate(450,t=>setBall(sx+(ex-sx)*t,sy+(ey-sy)*t),()=>{
   setBall(ex,ey);
   settleReceiver(ex,ey);
   finishQueuedReturns(next);
  });
 }else next()
}
function animate(ms,fn,done){
 const st=performance.now();
 function f(now){
  if(!playing)return;
  const t=Math.min(1,(now-st)/ms);fn(t);
  if(t<1)raf=requestAnimationFrame(f);
  else if(done)done();
  else next();
 }
 raf=requestAnimationFrame(f);
}
function next(){if(!playing)return;playIndex++;runStep()}

 arrows=(s.arrows||[]).map(a=>({...a}));sequence=(s.arrows||[]).map(a=>({...a}));opps.forEach(o=>o.el.remove());opps=[];

function drillPreview(id){
 const s=trainingLibrary[id];if(!s)return;
 const m=document.getElementById("modal");m.classList.remove("hidden");
 const duration=((s.notes||"").match(/\b\d+(?:[-–]\d+)?\s*min\b/i)||[])[0]||"Coach-led";
 const safeTitle=s.title.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 const safeNotes=(s.notes||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 const timerMinutes=Math.max(1,parseInt((duration.match(/\d+/)||["10"])[0],10));
 let remaining=timerMinutes*60,timer=null,running=false;
 const fmt=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
 const renderTimer=()=>{const el=m.querySelector("#drillTimer");if(el)el.textContent=fmt(remaining)};
 m.innerHTML="<h2>▶️ Drill Mode</h2><h3>"+safeTitle+"</h3><div class=\"card\"><strong>⏱️ Suggested duration:</strong> "+duration+"</div><div class=\"card\"><strong>⏱️ Drill Timer</strong><div id=\"drillTimer\" style=\"font-size:2rem;font-weight:800;margin:8px 0\"></div><div class=\"row\"><button id=\"timerStart\">▶ Start</button> <button id=\"timerPause\">⏸ Pause</button> <button id=\"timerReset\">↺ Reset</button></div></div><div class=\"card\"><strong>🎯 Coaching information</strong><p>"+safeNotes.replace(/\\n/g,"<br>")+"</p></div><div class=\"row\"><button id=\"drillLoad\">▶ Load Drill</button> <button id=\"drillBack\">← Back to Training</button> <button id=\"drillClose\">Close</button></div>";
 renderTimer();
 const stopTimer=()=>{if(timer){clearInterval(timer);timer=null}running=false};
 const startTimer=()=>{if(running||remaining<=0)return;running=true;timer=setInterval(()=>{remaining=Math.max(0,remaining-1);renderTimer();if(remaining===0){stopTimer();msg(s.title+" • TIME");}},1000)};
 m.querySelector("#timerStart").onclick=startTimer;
 m.querySelector("#timerPause").onclick=stopTimer;
 m.querySelector("#timerReset").onclick=()=>{stopTimer();remaining=timerMinutes*60;renderTimer()};
 m.querySelector("#drillLoad").onclick=()=>{stopTimer();loadTraining(id)};
 m.querySelector("#drillBack").onclick=()=>{stopTimer();training()};
 m.querySelector("#drillClose").onclick=()=>{stopTimer();m.classList.add("hidden")};
}

notes.addEventListener("input",()=>{clearTimeout(window.__noteTimer);window.__noteTimer=setTimeout(persist,250)});
pitch.addEventListener("pointerdown",e=>{if(tool==="opp"&&!frozen&&e.target===pitch){const q=posFromEvent(e);addOppAt(q.x,q.y)}});
function addOppAt(x,y,silent=false){if(frozen)return;if(!silent)pushHistory();const el=document.createElement("div");el.className="player opp";el.textContent="O";pitch.appendChild(el);const o={x,y,el};opps.push(o);renderOpp(o);elDown(el,e=>{if(frozen)return;e.preventDefault();pushHistory();const startX=o.x,startY=o.y;let moved=false;try{el.setPointerCapture(e.pointerId)}catch(_){}const move=ev=>{const q=posFromEvent(ev);o.x=q.x;o.y=q.y;if(Math.abs(o.x-startX)+Math.abs(o.y-startY)>0.5)moved=true;renderOpp(o)};const up=()=>{el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);if(!moved)history.pop();persist();msg(moved?"OPPONENT POSITIONED":"OPPONENT SELECTED")};el.addEventListener("pointermove",move);el.addEventListener("pointerup",up)});persist();msg("OPPONENT ADDED • drag to position")}

for(let i=0;i<11;i++)createPlayer(i);
ensureBoardIntegrity();
const saved=localStorage.getItem(key);
if(saved){
  try{restore(JSON.parse(saved));ensureBoardIntegrity()}catch(_){
    localStorage.removeItem(key);
    formation="433";arrows=[];sequence=[];opps.forEach(o=>o.el.remove());opps=[];
    players.forEach((p,i)=>{p.x=formations["433"][i][0];p.y=formations["433"][i][1];p.name="Player "+(i+1);renderPlayer(p)});
    setBall(50,50);notes.value="";draw();
  }
}
msg("READY • 11 PLAYERS + BALL • PRO PRESS ENGINE • V9");
window.addEventListener("load",()=>{ensureBoardIntegrity();setBall(ballPos.x,ballPos.y);draw();});
window.addEventListener("pageshow",()=>{ensureBoardIntegrity();ball.style.display="flex";setBall(ballPos.x,ballPos.y);players.forEach(renderPlayer);draw()});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>("caches" in window)?caches.keys():[]).then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{}));}
})();
</script>
</body>
