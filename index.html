<style>
*{box-sizing:border-box}html,body{margin:0;background:#0d1014;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding-bottom:18px}.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px 5px}.top img{width:46px;height:46px}.top h1{font-size:18px;margin:0}.top p{margin:1px 0 0;color:#9da7b3;font-size:11px}
.wrap{width:96%;max-width:820px;margin:auto}.tabs,.tools,.actions{display:grid;gap:6px}.tabs{grid-template-columns:repeat(5,1fr)}.tools{grid-template-columns:repeat(5,1fr);margin-top:6px}.actions{grid-template-columns:repeat(4,1fr);margin-top:6px}
button{border:1px solid #343b45;background:#1b2027;color:#fff;border-radius:9px;min-height:42px;font-weight:800;font-size:11px;padding:7px;touch-action:manipulation}button.active{background:#1858b5;border-color:#8ab7ff}button.danger{background:#8e2530}.status{margin:6px 0;background:#151a20;border:1px solid #2c333c;border-radius:8px;padding:7px;text-align:center;font-size:11px;color:#c8d0d9}
#pitch{position:relative;width:100%;height:min(72vh,720px);min-height:500px;margin:7px auto;background:#16813a;border:4px solid #fff;border-radius:9px;overflow:hidden;touch-action:none;user-select:none}
.line{position:absolute;pointer-events:none;border-color:#ffffffcc}.half{left:0;right:0;top:50%;border-top:2px solid}.centre{left:50%;top:50%;width:116px;height:116px;border:2px solid;border-radius:50%;transform:translate(-50%,-50%)}.box{left:20%;width:60%;height:17%;border:2px solid}.box.a{top:0}.box.b{bottom:0}.goal{left:38%;width:24%;height:5%;border:2px solid}.goal.a{top:0}.goal.b{bottom:0}
.player{position:absolute;width:48px;height:48px;border-radius:50%;background:#1d5dbb;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;transform:translate(-50%,-50%);z-index:20;touch-action:none;box-shadow:0 2px 6px #0009}.player.gk{background:#f2c500;color:#111}.player.selected{outline:4px solid #ffd84d;outline-offset:2px}.player .num{font-size:15px}.player .nm{position:absolute;top:47px;white-space:nowrap;font-size:10px;text-shadow:0 1px 3px #000;font-weight:800}.opp{background:#c62828!important;z-index:19!important}.ball{position:absolute;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #111;color:#111;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);z-index:30;font-size:24px;touch-action:none;box-shadow:0 2px 6px #0009}
#svg{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}.run{stroke:#fff;stroke-width:3;stroke-dasharray:9 7;fill:none}.pass{stroke:#ffd84d;stroke-width:3;fill:none}.arrow{marker-end:url(#head)}
.bottom{margin-top:6px}.panel{margin-top:7px;background:#151a20;border:1px solid #2c333c;border-radius:10px;padding:8px}.panel textarea{width:100%;min-height:70px;border:0;border-radius:7px;padding:9px;font:13px system-ui}.hidden{display:none!important}
.modal{position:fixed;inset:3%;z-index:100;background:#0f1318;border:1px solid #3b434d;border-radius:14px;padding:14px;overflow:auto;text-align:left}.modal h2{margin:0 0 8px}.row{display:flex;gap:7px;align-items:center;justify-content:space-between;margin:7px 0}.row input,.row select{flex:1;min-width:0;padding:9px;border-radius:7px;border:1px solid #3a424c;background:#20262e;color:#fff}
@media(max-width:600px){.tabs{grid-template-columns:repeat(3,1fr)}.tools{grid-template-columns:repeat(3,1fr)}.actions{grid-template-columns:repeat(2,1fr)}#pitch{height:66vh;min-height:500px}.player{width:45px;height:45px}.player .nm{top:43px;font-size:9px}}

<body>
<header class="top"><img src="https://assets.footylogos.com/logos/wealdstone-logo-footylogos.svg" alt="Wealdstone FC" onerror="this.onerror=null;this.src='icon.svg'"><div><h1>WEALDSTONE FC COACH BOARD</h1><p>Professional tactical planning • mobile ready</p></div></header>
<main class="wrap">
<div class="tabs">
<button data-formation="433" class="active">4-3-3</button><button data-formation="442">4-4-2</button><button data-formation="352">3-5-2</button><button data-formation="4231">4-2-3-1</button><button data-formation="4141">4-1-4-1</button>
</div>
<div class="tools">
<button data-tool="select" class="active">👆 Select</button><button data-tool="pass">➜ Pass</button><button data-tool="run">↗ Run</button><button data-tool="ball">⚽ Ball</button><button data-tool="opp">🔴 Opp</button>
</div>
<div class="actions">
<button id="record">⏺ Record</button><button id="newSession">🆕 New Session</button><button id="stop">⏹ Stop</button><button id="play">▶ Play</button><button id="clear">🧹 Clear</button><button id="undo">↶ Undo</button><button id="save">💾 Save</button><button id="library">📚 Library</button><button id="more">🧠 Coach Hub</button>
</div>

<section id="pitch">
<svg id="svg" viewBox="0 0 1000 700" preserveAspectRatio="none"><defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="currentColor"/></marker></defs></svg>
<div class="line half"></div><div class="line centre"></div><div class="line box a"></div><div class="line box b"></div><div class="line goal a"></div><div class="line goal b"></div>
<div id="ball" class="ball" style="left:50%;top:50%">⚽</div>
</section>
<div class="actions bottom"><button id="grid">▦ Grid</button><button id="reset">⌂ Reset XI</button><button id="oppClear">✕ Clear Opp</button><button id="freeze">🔒 Freeze</button></div>
<div class="panel"><textarea id="notes" placeholder="Coach notes — objectives, triggers, details..."></textarea></div>
</main>
<div id="modal" class="modal hidden"></div>
<script>
(function(){
"use strict";
const pitch=document.getElementById("pitch"),svg=document.getElementById("svg"),ball=document.getElementById("ball"),status=document.getElementById("status"),notes=document.getElementById("notes");
const formations={
"433":[[50,88],[18,72],[38,76],[62,76],[82,72],[30,57],[50,63],[70,57],[18,32],[50,25],[82,32]],
"442":[[50,88],[18,72],[38,76],[62,76],[82,72],[18,52],[38,57],[62,57],[82,52],[35,30],[65,30]],
"352":[[50,88],[25,72],[50,76],[75,72],[15,55],[35,58],[50,52],[65,58],[85,55],[35,30],[65,30]],
"4231":[[50,88],[18,72],[38,76],[62,76],[82,72],[35,58],[65,58],[18,36],[50,42],[82,36],[50,25]],
"4141":[[50,88],[18,72],[38,76],[62,76],[82,72],[50,63],[18,43],[38,48],[62,48],[82,43],[50,25]]
};
let formation="433",tool="select",players=[],opps=[],arrows=[],history=[],sequence=[],recording=false,playing=false,playIndex=0,raf=0,ballPos={x:50,y:50},frozen=false;
let names=Array.from({length:11},(_,i)=>"Player "+(i+1));
const key="wealdstone_pro_coach_v1";
function msg(t){status.textContent=t;status.setAttribute("aria-live","polite")}
// ELITE COACHING UX + SAFE INTERACTION LAYER
function stopPlayback(){if(playing){playing=false;cancelAnimationFrame(raf);msg("PLAYBACK STOPPED")}}
function clearSelection(){window.passStart=null;players.forEach(p=>p.el.classList.remove("selected"))}
function ensureBoardIntegrity(){
  while(players.length<11)createPlayer(players.length);
  if(players.length>11){players.slice(11).forEach(p=>p.el.remove());players=players.slice(0,11)}
  players.forEach((p,i)=>{if(!Number.isFinite(p.x)||!Number.isFinite(p.y)){p.x=formations[formation][i][0];p.y=formations[formation][i][1]}renderPlayer(p)});
  if(!Number.isFinite(ballPos.x)||!Number.isFinite(ballPos.y))setBall(50,50);
  ball.style.display="flex";draw();
}
function newSession(){stopPlayback();clearSelection();pushHistory();formation="433";players.forEach((p,i)=>{p.x=formations[formation][i][0];p.y=formations[formation][i][1]});arrows=[];sequence=[];opps.forEach(o=>o.el.remove());opps=[];setBall(50,50);notes.value="";draw();persist();document.querySelectorAll("[data-formation]").forEach(b=>b.classList.toggle("active",b.dataset.formation==="433"));msg("NEW SESSION • 4-3-3 READY")}

function persist(){try{localStorage.setItem(key,JSON.stringify(snapshot()))}catch(_){}}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function posFromEvent(e){const r=pitch.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width*100,1,99),y:clamp((e.clientY-r.top)/r.height*100,1,99)}}
function pushHistory(){history.push(JSON.stringify(snapshot()));if(history.length>30)history.shift()}
function snapshot(){return{formation,names:names.slice(),players:players.map(p=>({x:p.x,y:p.y})),opps:opps.map(o=>({x:o.x,y:o.y})),arrows:arrows.map(a=>({...a})),ball:{...ballPos},sequence:sequence.map(a=>({...a})),notes:notes.value}}
function renderPlayer(p){p.el.style.left=p.x+"%";p.el.style.top=p.y+"%";p.el.querySelector(".nm").textContent=p.name}
function createPlayer(i){
 const el=document.createElement("div");el.className="player"+(i===0?" gk":"");el.innerHTML='<span class="num">'+(i+1)+'</span><span class="nm"></span>';pitch.appendChild(el);
 const p={i,x:formations[formation][i][0],y:formations[formation][i][1],name:names[i],el};players.push(p);renderPlayer(p);dragPlayer(p)
}
function dragPlayer(p){
 let active=false,dragStart=null;
 elDown(p.el,e=>{
  if(frozen)return;
  if(tool==="pass"){selectPassStart(p);return}
  if(tool==="opp"&&p.i<0)return;
  if(tool!=="select"&&tool!=="run")return;
  e.preventDefault();active=true;dragStart={x:p.x,y:p.y};p.__runStart=dragStart;pushHistory();try{p.el.setPointerCapture(e.pointerId)}catch(_){}
  const move=ev=>{if(!active)return;const q=posFromEvent(ev);p.x=q.x;p.y=q.y;renderPlayer(p);if(tool==="run"&&recording)drawLiveRun(p,q)};
  const up=()=>{if(!active)return;active=false;p.el.removeEventListener("pointermove",move);p.el.removeEventListener("pointerup",up);if(tool==="run"&&recording)recordRun(p,dragStart);dragStart=null;persist();msg(tool==="run"&&recording?"RUN RECORDED • "+(p.i+1):"PLAYER "+(p.i+1)+" POSITIONED")};
  p.el.addEventListener("pointermove",move);p.el.addEventListener("pointerup",up)
 })
}
function elDown(el,fn){el.addEventListener("pointerdown",fn,{passive:false})}
function selectPassStart(p){
 if(!window.passStart){window.passStart=p;p.el.classList.add("selected");msg("PASS • "+(p.i+1)+" selected • now tap receiver");return}
 const a=window.passStart,b=p;window.passStart=null;
 players.forEach(x=>x.el.classList.remove("selected"));
 if(a===b){msg("PASS CANCELLED • choose another player");return}
 pushHistory();
 const pass={type:"pass",x1:a.x,y1:a.y,x2:b.x,y2:b.y};
 arrows.push(pass);
 if(recording)sequence.push({...pass});
 draw();persist();
 const sx=a.x,sy=a.y;
 setBall(sx,sy);
 const wasPlaying=playing; playing=true;
 animate(500,t=>setBall(sx+(b.x-sx)*t,sy+(b.y-sy)*t),()=>{
   setBall(b.x,b.y);playing=wasPlaying;
   msg("PASS COMPLETE • "+(a.i+1)+" → "+(b.i+1));
 });
}
function drawLiveRun(p,q){
 draw();
 if(!recording||tool!=="run"||!p.__runStart)return;
 const a=p.__runStart;
 const l=document.createElementNS("http://www.w3.org/2000/svg","line");
 l.classList.add("dyn","run","arrow","liveRun");
 l.setAttribute("x1",a.x*10);l.setAttribute("y1",a.y*7);l.setAttribute("x2",q.x*10);l.setAttribute("y2",q.y*7);
 l.style.color="#fff";svg.appendChild(l);
}
function recordRun(p,start){svg.querySelectorAll(".liveRun").forEach(x=>x.remove());if(start&&((Math.abs(start.x-p.x)+Math.abs(start.y-p.y))>0.5)){const a={type:"run",i:p.i,x1:start.x,y1:start.y,x2:p.x,y2:p.y};sequence.push({...a});arrows.push(a);draw()}}
function draw(){
 svg.querySelectorAll(".dyn").forEach(x=>x.remove());
 arrows.forEach(a=>{const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.classList.add("dyn",a.type==="run"?"run":"pass","arrow");l.setAttribute("x1",a.x1*10);l.setAttribute("y1",a.y1*7);l.setAttribute("x2",a.x2*10);l.setAttribute("y2",a.y2*7);l.style.color=a.type==="run"?"#fff":"#ffd84d";svg.appendChild(l)})
}
function setBall(x,y){ballPos={x,y};ball.style.left=x+"%";ball.style.top=y+"%"}
elDown(ball,e=>{
 if(frozen||tool!=="ball")return;e.preventDefault();try{ball.setPointerCapture(e.pointerId)}catch(_){}
 const move=ev=>{const q=posFromEvent(ev);setBall(q.x,q.y)};
 const up=()=>{ball.removeEventListener("pointermove",move);ball.removeEventListener("pointerup",up);if(recording)sequence.push({type:"ball",x:ballPos.x,y:ballPos.y});persist();msg("BALL POSITIONED")};
 ball.addEventListener("pointermove",move);ball.addEventListener("pointerup",up)
});
function setFormation(f){pushHistory();formation=f;players.forEach((p,i)=>{p.x=formations[f][i][0];p.y=formations[f][i][1];renderPlayer(p)});document.querySelectorAll("[data-formation]").forEach(b=>b.classList.toggle("active",b.dataset.formation===f));draw();persist();msg("FORMATION • "+f)}
function setTool(t){tool=t;window.passStart=null;document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));msg(t==="pass"?"PASS MODE • tap passer then receiver":t==="run"?"RUN MODE • drag players while recording":t==="ball"?"BALL MODE • drag the ball":"SELECT MODE • drag players")}
function addOpp(){if(frozen)return;const n=opps.length;const el=document.createElement("div");el.className="player opp";el.textContent="O";pitch.appendChild(el);const o={x:72-(n%4)*8,y:25+Math.floor(n/4)*18,el};opps.push(o);renderOpp(o);elDown(el,e=>{if(frozen)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}const move=ev=>{const q=posFromEvent(ev);o.x=q.x;o.y=q.y;renderOpp(o)};const up=()=>{el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);persist();msg("OPPONENT POSITIONED")};el.addEventListener("pointermove",move);el.addEventListener("pointerup",up)});persist();msg("OPPONENT ADDED • drag to position")}
function renderOpp(o){o.el.style.left=o.x+"%";o.el.style.top=o.y+"%"}
function clearOpp(silent=false){opps.forEach(o=>o.el.remove());opps=[];if(!silent){persist();msg("OPPOSITION CLEARED")}}
function reset(){pushHistory();players.forEach((p,i)=>{p.x=formations[formation][i][0];p.y=formations[formation][i][1];renderPlayer(p)});arrows=[];sequence=[];setBall(50,50);draw();persist();msg("XI RESET • "+formation)}
function clear(){pushHistory();arrows=[];sequence=[];draw();persist();msg("TACTICAL DRAWING CLEARED")}
function undo(){if(!history.length){msg("NOTHING TO UNDO");return}const s=JSON.parse(history.pop());restore(s);persist();msg("UNDO COMPLETE")}
function restore(s){formation=s.formation||"433";names=s.names||names;while(players.length<11)createPlayer(players.length);players.forEach((p,i)=>{const q=s.players[i]||formations[formation][i];p.x=q.x;p.y=q.y;p.name=names[i]||("Player "+(i+1));renderPlayer(p)});clearOpp(true);(s.opps||[]).forEach(o=>{addOpp();const x=opps[opps.length-1];x.x=o.x;x.y=o.y;renderOpp(x)});arrows=s.arrows||[];sequence=s.sequence||[];setBall((s.ball||{}).x??50,(s.ball||{}).y??50);notes.value=s.notes||"";draw();document.querySelectorAll("[data-formation]").forEach(b=>b.classList.toggle("active",b.dataset.formation===formation))}
function startRec(){if(playing){playing=false;cancelAnimationFrame(raf)};recording=true;sequence=[];msg("RECORDING • drag players for runs or add passes")}
function stopRec(){recording=false;persist();msg("RECORDING STOPPED • "+sequence.length+" actions")}
function play(){
 ensureBoardIntegrity();
 if(!sequence.length){msg("NO RECORDED PLAY");return}
 if(playing){playing=false;cancelAnimationFrame(raf);msg("PLAY PAUSED • tap Play to restart");return}
 playing=true;playIndex=0;setBall(50,50);msg("PLAYING • 1/"+sequence.length);runStep()
}
function runStep(){
 if(!playing)return;
 if(playIndex>=sequence.length){playing=false;persist();msg("PLAY COMPLETE • "+sequence.length+" actions");return}
 const a=sequence[playIndex];
 if(a.type==="run"){
  const p=players[a.i];
  if(p){p.x=a.x1;p.y=a.y1;renderPlayer(p);animate(650,t=>{p.x=a.x1+(a.x2-a.x1)*t;p.y=a.y1+(a.y2-a.y1)*t;renderPlayer(p)})}else next()
 }else if(a.type==="pass"){
  setBall(a.x1,a.y1);
  animate(550,t=>setBall(a.x1+(a.x2-a.x1)*t,a.y1+(a.y2-a.y1)*t))
 }else if(a.type==="ball"){
  const sx=ballPos.x,sy=ballPos.y;
  animate(450,t=>setBall(sx+(a.x-sx)*t,sy+(a.y-sy)*t))
 }else next()
}
function animate(ms,fn,done){
 const st=performance.now();
 function f(now){
  if(!playing)return;
  const t=Math.min(1,(now-st)/ms);fn(t);
  if(t<1)raf=requestAnimationFrame(f);
  else if(done)done();
  else next();
 }
 raf=requestAnimationFrame(f);
}
function next(){if(!playing)return;playIndex++;msg("PLAYING • "+Math.min(playIndex+1,sequence.length)+"/"+sequence.length);runStep()}
function save(){
 const data=snapshot();localStorage.setItem(key,JSON.stringify(data));msg("TACTIC SAVED ON THIS PHONE")
}
function load(){
 const raw=localStorage.getItem(key);if(!raw){msg("NO SAVED TACTIC");return}try{restore(JSON.parse(raw));msg("TACTIC LOADED")}catch(_){msg("SAVE LOAD FAILED")}}
const presetLibrary={
 "playing-back":{title:"Pro Template • Playing From The Back",formation:"433",notes:"Build with the goalkeeper + centre-backs. Create a short outlet, move the ball through midfield, then progress into the front three.",players:[[50,88],[18,72],[38,76],[62,76],[82,72],[32,57],[50,62],[68,57],[18,32],[50,25],[82,32]],ball:[50,88],arrows:[
  {type:"pass",x1:50,y1:88,x2:38,y2:76},{type:"pass",x1:38,y1:76,x2:32,y2:57},{type:"pass",x1:32,y1:57,x2:50,y2:62},{type:"pass",x1:50,y1:62,x2:68,y2:57},{type:"pass",x1:68,y1:57,x2:82,y2:32}
 ]},
 "set-piece":{title:"Pro Template • Attacking Corner",formation:"433",notes:"Corner routine: create a screen/cluster, attack the near-central zone and prepare a second-phase recycle.",players:[[50,88],[18,72],[38,76],[62,76],[82,72],[30,57],[50,63],[70,57],[24,22],[54,16],[80,28]],ball:[8,10],arrows:[
  {type:"run",i:9,x1:54,y1:16,x2:50,y2:32},{type:"run",i:8,x1:24,y1:22,x2:42,y2:35},{type:"run",i:10,x1:80,y1:28,x2:68,y2:38},{type:"pass",x1:8,y1:10,x2:50,y2:32}
 ]},
 "goal-kick":{title:"Pro Template • Goal-Kick Build-Up",formation:"4231",notes:"Goal-kick structure: give the goalkeeper multiple short options, use the double pivot to create a safe third-man route and progress wide.",players:[[50,88],[18,72],[38,76],[62,76],[82,72],[35,58],[65,58],[18,36],[50,42],[82,36],[50,25]],ball:[50,88],arrows:[
  {type:"pass",x1:50,y1:88,x2:38,y2:76},{type:"pass",x1:38,y1:76,x2:35,y2:58},{type:"pass",x1:35,y1:58,x2:50,y2:42},{type:"pass",x1:50,y1:42,x2:82,y2:36},{type:"run",i:10,x1:50,y1:25,x2:62,y2:20}
 ]},
 "press":{title:"Pro Template • High Press",formation:"433",notes:"Pressing template: front three curve their runs to screen central access, midfield squeezes behind and the back line holds a compact high position.",players:[[50,88],[18,72],[38,76],[62,76],[82,72],[30,57],[50,63],[70,57],[18,32],[50,25],[82,32]],ball:[50,50],arrows:[
  {type:"run",i:8,x1:18,y1:32,x2:35,y2:24},{type:"run",i:9,x1:50,y1:25,x2:50,y2:18},{type:"run",i:10,x1:82,y1:32,x2:65,y2:24},{type:"run",i:5,x1:30,y1:57,x2:38,y2:48},{type:"run",i:7,x1:70,y1:57,x2:62,y2:48}
 ]},
 "def-corner":{title:"Pro Template • Defending Corner",formation:"442",notes:"Defensive corner template: protect the six-yard area, assign markers, leave an outlet and prepare for the second phase.",players:[[50,88],[18,72],[38,76],[62,76],[82,72],[18,52],[38,57],[62,57],[82,52],[35,30],[65,30]],ball:[8,10],arrows:[
  {type:"run",i:4,x1:82,y1:72,x2:78,y2:42},{type:"run",i:5,x1:18,y1:52,x2:24,y2:40},{type:"run",i:6,x1:38,y1:57,x2:38,y2:40},{type:"run",i:7,x1:62,y1:57,x2:62,y2:40}
 ]}
};
function loadPreset(id){
 const s=presetLibrary[id];if(!s)return;
 pushHistory();formation=s.formation;while(players.length<11)createPlayer(players.length);
 players.forEach((p,i)=>{const q=s.players[i];p.x=q[0];p.y=q[1];p.name=names[i];renderPlayer(p)});
 arrows=(s.arrows||[]).map(a=>({...a}));sequence=(s.arrows||[]).map(a=>({...a}));opps.forEach(o=>o.el.remove());opps=[];
 setBall(s.ball[0],s.ball[1]);notes.value=s.notes||"";draw();persist();
 document.querySelectorAll("[data-formation]").forEach(b=>b.classList.toggle("active",b.dataset.formation===formation));
 document.getElementById("modal").classList.add("hidden");msg(s.title+" • LOADED");
}
function library(){
 const m=document.getElementById("modal");m.classList.remove("hidden");
 m.innerHTML='<h2>📚 Professional Tactic Library</h2><p>Ready-made coaching templates based on widely documented elite tactical principles. These are training templates, not official club playbooks.</p>'+
 '<button data-preset="playing-back">⚽ Playing From The Back</button> '+
 '<button data-preset="goal-kick">🧤 Goal-Kick Build-Up</button> '+
 '<button data-preset="set-piece">🚩 Attacking Corner</button> '+
 '<button data-preset="def-corner">🛡️ Defending Corner</button> '+

function hub(){
 const m=document.getElementById("modal");m.classList.remove("hidden");
 const savedOk=!!localStorage.getItem(key);
 m.innerHTML='<h2>🧠 Coach Hub</h2><p>Professional coaching controls</p>'+
 '<div class="row"><b>Engine</b><span>READY • '+players.length+' players • ball active</span></div>'+

}

document.getElementById("reset").onclick=()=>{stopPlayback();clearSelection();reset()};

document.getElementById("grid").onclick=function(){pitch.classList.toggle("grid");this.classList.toggle("active",pitch.classList.contains("grid"));if(pitch.classList.contains("grid"))pitch.style.backgroundImage="linear-gradient(#ffffff18 1px,transparent 1px),linear-gradient(90deg,#ffffff18 1px,transparent 1px)";else pitch.style.backgroundImage="none"};
document.getElementById("freeze").onclick=function(){frozen=!frozen;this.classList.toggle("active",frozen);msg(frozen?"BOARD FROZEN":"BOARD UNLOCKED")};\ndocument.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("modal").classList.add("hidden");window.passStart=null;players.forEach(p=>p.el.classList.remove("selected"))}});\npitch.addEventListener("pointercancel",()=>{window.passStart=null;players.forEach(p=>p.el.classList.remove("selected"))});
notes.addEventListener("input",()=>{clearTimeout(window.__noteTimer);window.__noteTimer=setTimeout(persist,250)});
pitch.addEventListener("dblclick",e=>{if(tool==="opp")addOpp()});
pitch.addEventListener("pointerdown",e=>{if(tool==="opp"&&!frozen&&e.target===pitch){const q=posFromEvent(e);addOppAt(q.x,q.y)}});
function addOppAt(x,y){if(frozen)return;const el=document.createElement("div");el.className="player opp";el.textContent="O";pitch.appendChild(el);const o={x,y,el};opps.push(o);renderOpp(o);elDown(el,e=>{if(frozen)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}const move=ev=>{const q=posFromEvent(ev);o.x=q.x;o.y=q.y;renderOpp(o)};const up=()=>{el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);persist();msg("OPPONENT POSITIONED")};el.addEventListener("pointermove",move);el.addEventListener("pointerup",up)});persist();msg("OPPONENT ADDED • drag to position")}

for(let i=0;i<11;i++)createPlayer(i);
const saved=localStorage.getItem(key);if(saved)try{restore(JSON.parse(saved))}catch(_){}
msg("READY • 11 PLAYERS + BALL LOADED");
window.addEventListener("pageshow",()=>{ball.style.display="flex";players.forEach(renderPlayer)});
})();
