<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Wealdstone Tactics">
<link rel="manifest" href="manifest.json">
<title>Wealdstone FC Tactics Board</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;text-align:center}
h1{margin:14px 0 4px;font-size:25px}p{margin:0 0 10px}.controls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px}
button{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;font-size:14px}button.active{background:#174ea6;color:#fff}
#pitch{position:relative;margin:10px auto;width:94%;max-width:700px;height:min(75vh,850px);min-height:500px;background:#16833b;border:4px solid #fff;border-radius:8px;overflow:hidden}
.mark{position:absolute;border:2px solid #fff;pointer-events:none}.mid{top:50%;left:0;width:100%;border-top:2px solid #fff}.circle{top:50%;left:50%;width:120px;height:120px;border-radius:50%;transform:translate(-50%,-50%)}
.box.top{top:0;left:20%;width:60%;height:17%}.box.bottom{bottom:0;left:20%;width:60%;height:17%}.goal.top{top:0;left:38%;width:24%;height:5%}.goal.bottom{bottom:0;left:38%;width:24%;height:5%}
.player{position:absolute;width:48px;height:48px;border-radius:50%;background:#174ea6;border:3px solid #fff;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;cursor:grab}.player.gk{background:#f5c400;color:#111}.player.selected{outline:4px solid #fff;outline-offset:3px}
@media(max-width:600px){#pitch{min-height:520px;height:70vh}.player{width:46px;height:46px}}
</style>
</head>
<body>
<h1>WEALDSTONE FC</h1><p>Tactics Board</p>
<div class="controls"><button class="active" onclick="setFormation('433',this)">4-3-3</button><button onclick="setFormation('442',this)">4-4-2</button><button onclick="setFormation('352',this)">3-5-2</button><button onclick="resetBoard()">Reset</button></div>
<div id="pitch"><div class="mark mid"></div><div class="mark circle"></div><div class="mark box top"></div><div class="mark box bottom"></div><div class="mark goal top"></div><div class="mark goal bottom"></div></div>
<script>
const pitch=document.getElementById("pitch"),formations={433:[[50,88],[18,72],[38,76],[62,76],[82,72],[30,57],[50,62],[70,57],[18,32],[50,25],[82,32]],442:[[50,88],[18,72],[38,76],[62,76],[82,72],[18,52],[38,57],[62,57],[82,52],[35,30],[65,30]],352:[[50,88],[25,72],[50,76],[75,72],[15,55],[35,58],[50,52],[65,58],[85,55],[35,30],[65,30]]};let players=[];
for(let i=0;i<11;i++){let p=document.createElement("div");p.className="player"+(i===0?" gk":"");p.textContent=i+1;makeDraggable(p);pitch.appendChild(p);players.push(p)}
function setFormation(name,btn){document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");formations[name].forEach((pos,i)=>{players[i].style.left=pos[0]+"%";players[i].style.top=pos[1]+"%"})}
function makeDraggable(el){let move=e=>{let r=pitch.getBoundingClientRect(),x=e.clientX-r.left-el.offsetWidth/2,y=e.clientY-r.top-el.offsetHeight/2;el.style.left=Math.max(0,Math.min(r.width-el.offsetWidth,x))+"px";el.style.top=Math.max(0,Math.min(r.height-el.offsetHeight,y))+"px"};el.addEventListener("pointerdown",e=>{el.classList.add("selected");el.setPointerCapture(e.pointerId);el.addEventListener("pointermove",move);el.addEventListener("pointerup",()=>{el.removeEventListener("pointermove",move);el.classList.remove("selected")},{once:true})})}
function resetBoard(){setFormation("433",document.querySelector(".controls button"))}setFormation("433",document.querySelector(".controls button"));
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script></body></html>
