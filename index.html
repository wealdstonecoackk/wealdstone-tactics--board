<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wealdstone FC Tactics Board</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:white;text-align:center}
h1{margin:18px 0}
#pitch{position:relative;margin:auto;width:92%;max-width:700px;height:75vh;max-height:850px;background:#16833b;border:4px solid white;border-radius:8px}
.line{position:absolute;background:white}
.mid{top:50%;left:0;width:100%;height:2px}
.circle{position:absolute;top:50%;left:50%;width:120px;height:120px;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%)}
.player{position:absolute;width:48px;height:48px;border-radius:50%;background:#174ea6;border:3px solid white;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;touch-action:none}
button{margin:15px;padding:12px 22px;border:0;border-radius:8px;font-size:16px}
</style>
</head>
<body>
<h1>WEALDSTONE FC</h1>
<p>Tactics Board</p>
<div id="pitch">
<div class="line mid"></div>
<div class="circle"></div>
</div>
<button onclick="resetBoard()">Reset</button>

<script>
const pitch=document.getElementById("pitch");

for(let i=1;i<=11;i++){
 const p=document.createElement("div");
 p.className="player";
 p.textContent=i;
 p.style.left=(8+((i-1)%4)*27)+"%";
 p.style.top=(10+Math.floor((i-1)/4)*28)+"%";
 makeDraggable(p);
 pitch.appendChild(p);
}

function makeDraggable(el){
 let move=e=>{
  const r=pitch.getBoundingClientRect();
  const x=(e.clientX-r.left-24);
  const y=(e.clientY-r.top-24);
  el.style.left=Math.max(0,Math.min(r.width-48,x))+"px";
  el.style.top=Math.max(0,Math.min(r.height-48,y))+"px";
 };
 el.addEventListener("pointerdown",e=>{
  el.setPointerCapture(e.pointerId);
  el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",()=>el.removeEventListener("pointermove",move),{once:true});
 });
}

function resetBoard(){location.reload()}
</script>
</body>
</html>
