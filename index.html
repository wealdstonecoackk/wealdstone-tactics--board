<script>
const pitch=document.getElementById("pitch"),svg=document.getElementById("arrows"),notes=document.getElementById("notes"),status=document.getElementById("status");
const formations={433:[[50,88],[18,72],[38,76],[62,76],[82,72],[30,57],[50,62],[70,57],[18,32],[50,25],[82,32]],442:[[50,88],[18,72],[38,76],[62,76],[82,72],[18,52],[38,57],[62,57],[82,52],[35,30],[65,30]],352:[[50,88],[25,72],[50,76],[75,72],[15,55],[35,58],[50,52],[65,58],[85,55],[35,30],[65,30]],4231:[[50,88],[18,72],[38,76],[62,76],[82,72],[35,58],[65,58],[18,36],[50,42],[82,36],[50,25]],4141:[[50,88],[18,72],[38,76],[62,76],[82,72],[50,63],[18,43],[38,48],[62,48],[82,43],[50,25]]};
let players=[],names=Array.from({length:11},(_,i)=>"Player "+(i+1)),arrowMode=false,arrowStart=null,movementMode=false,currentFormation="433",arrows=[],history=[],oppositionMode=false,deferredInstallPrompt=null;
let sequence=[],recording=false,playStep=0,ballX=50,ballY=50,ballMode=false,oneTouch=false,oneTouchPlayer=null;let ball=document.createElement("div");ball.className="ball";ball.textContent="⚽";ball.setAttribute("aria-label","Tactical ball");pitch.appendChild(ball);let playTimer=null,playIndex=0,playing=false,playStart=0,playDuration=900;for(let i=0;i<11;i++){let p=document.createElement("div");p.className="player"+(i===0?" gk":"");p.innerHTML='<span class="num">'+(i+1)+'</span><span class="name"></span>';pitch.appendChild(p);players.push(p);makeDraggable(p);p.ondblclick=()=>renameOne(i)}
function renderNames(){players.forEach((p,i)=>{p.querySelector(".name").textContent=names[i]||("Player "+(i+1));p.querySelector(".num").textContent=i+1})}
function openSessionHub(){var plays=safeSavedPlays(),m=document.getElementById('sessionHub');if(!m){m=document.createElement('div');m.id='sessionHub';m.style='display:none;position:fixed;inset:4%;z-index:80;background:#111;color:#fff;border:2px solid #fff;border-radius:14px;padding:16px;overflow:auto;text-align:left';document.body.appendChild(m)}var h='<h2>Session Planner</h2><p>Organise your saved plays into a coaching session.</p><label>Session name</label><input id="sessionName" value="Match Session" style="width:100%;padding:9px;margin:6px 0 12px"><label>Focus</label><select id="sessionPhase" style="width:100%;padding:9px;margin:6px 0 12px"><option>Build-up</option><option>Attack</option><option>Defend</option><option>Transition</option><option>Set Piece</option></select><h3>Saved plays</h3>'+(plays.length?plays.map(function(p,i){return '<label style="display:block;padding:7px"><input type="checkbox" class="sessionPlay" value="'+i+'"> '+String(p.name||('Play '+(i+1))).replace(/</g,'&lt;')+'</label>'}).join(''):'No saved plays yet.')+'<br><button onclick="saveSessionPlan()">💾 Save Session</button> <button onclick="closeSessionHub()">Close</button>';m.innerHTML=h;m.style.display='block'}function closeSessionHub(){var m=document.getElementById('sessionHub');if(m)m.style.display='none'}function saveSessionPlan(){var plan={name:(document.getElementById('sessionName').value||'Match Session').trim(),phase:document.getElementById('sessionPhase').value,plays:[].slice.call(document.querySelectorAll('.sessionPlay:checked')).map(function(x){return +x.value})};localStorage.setItem('wealdstone_session_plan',JSON.stringify(plan));status.textContent='Session plan saved on this phone.';closeSessionHub()}function saveMatchdayPack(){var pack={team:JSON.parse(localStorage.getItem('wealdstone_team')||'{}'),squad:JSON.parse(localStorage.getItem('wealdstone_squad_profile')||'[]'),starting11:JSON.parse(localStorage.getItem('wealdstone_starting11')||'[]'),captain:localStorage.getItem('wealdstone_captain')||'',tactic:getState(),session:JSON.parse(localStorage.getItem('wealdstone_session_plan')||'{}')};localStorage.setItem('wealdstone_matchday_pack',JSON.stringify(pack));status.textContent='Complete matchday pack saved on this phone.'}function loadMatchdayPack(){var raw=localStorage.getItem('wealdstone_matchday_pack');if(!raw){status.textContent='No matchday pack saved yet.';return}try{var p=JSON.parse(raw);if(p.tactic)applyState(p.tactic);if(Array.isArray(p.starting11))localStorage.setItem('wealdstone_starting11',JSON.stringify(p.starting11));if(p.captain!==undefined)localStorage.setItem('wealdstone_captain',p.captain);if(p.squad)localStorage.setItem('wealdstone_squad_profile',JSON.stringify(p.squad));if(p.session)localStorage.setItem('wealdstone_session_plan',JSON.stringify(p.session));status.textContent='Complete matchday pack loaded.'}catch(e){status.textContent='Could not load matchday pack.'}}function openMatchdayHub(){var m=document.getElementById('matchdayHub');if(!m){m=document.createElement('div');m.id='matchdayHub';m.style='display:none;position:fixed;inset:3%;z-index:90;background:#111;color:#fff;border:2px solid #fff;border-radius:14px;padding:16px;overflow:auto;text-align:left';document.body.appendChild(m)}var s=JSON.parse(localStorage.getItem('wealdstone_starting11')||'[]'),cap=localStorage.getItem('wealdstone_captain')||'';m.innerHTML='<h2>🏟 Matchday</h2><p><b>Formation:</b> '+currentFormation+'</p><h3>Starting XI</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+players.map(function(p,i){return '<div style="padding:7px;border-radius:8px;background:'+(s.includes(i)?'#164':'#333')+'">'+(s.includes(i)?'XI':'BENCH')+' — '+String(names[i]||('Player '+(i+1))).replace(/</g,'&lt;')+'</div>'}).join('')+'</div><h3>Captain</h3><select id="captainSelect" style="width:100%;padding:10px">'+players.map(function(p,i){return '<option value="'+i+'" '+(cap==i?'selected':'')+'>'+String(names[i]||('Player '+(i+1))).replace(/</g,'&lt;')+'</option>'}).join('')+'</select><br><br><button onclick="saveCaptain()">💾 Save Captain</button> <button onclick="closeMatchdayHub()">Close</button>';m.style.display='block'}function closeMatchdayHub(){var m=document.getElementById('matchdayHub');if(m)m.style.display='none'}function saveCaptain(){var x=document.getElementById('captainSelect');localStorage.setItem('wealdstone_captain',x.value);status.textContent='Captain saved.';closeMatchdayHub()}function openSquadHub(){var m=document.getElementById('squadHub');if(!m){m=document.createElement('div');m.id='squadHub';m.style='display:none;position:fixed;inset:3%;z-index:95;background:#111;color:#fff;border:2px solid #fff;border-radius:14px;padding:16px;overflow:auto;text-align:left';document.body.appendChild(m)}m.innerHTML='<h2>👥 Squad Manager</h2><p>Edit shirt numbers, positions and roles.</p>'+players.map(function(p,i){return '<div style="display:grid;grid-template-columns:55px 1fr 1fr 1fr;gap:6px;margin:7px 0"><input id="sn'+i+'" value="'+(i+1)+'" inputmode="numeric" style="padding:8px"><input id="sp'+i+'" value="'+String(names[i]||('Player '+(i+1))).replace(/"/g,'&quot;')+'" style="padding:8px"><select id="spos'+i+'" style="padding:8px"><option>GK</option><option>DEF</option><option>MID</option><option>WING</option><option>FWD</option></select><select id="srole'+i+'" style="padding:8px"><option>Starter</option><option>Bench</option><option>Captain</option></select></div>'}).join('')+'<br><button onclick="saveSquadProfile()">💾 Save Squad</button> <button onclick="closeSquadHub()">Close</button>';m.style.display='block'}function closeSquadHub(){var m=document.getElementById('squadHub');if(m)m.style.display='none'}function saveSquadProfile(){var profile=[];players.forEach(function(p,i){names[i]=(document.getElementById('sp'+i).value||('Player '+(i+1))).trim();profile.push({number:+document.getElementById('sn'+i).value||i+1,name:names[i],position:document.getElementById('spos'+i).value,role:document.getElementById('srole'+i).value})});localStorage.setItem('wealdstone_squad_profile',JSON.stringify(profile));renderNames();status.textContent='Squad profile saved.';closeSquadHub()}function coachHealthCheck(){var checks=[],raw;try{raw=localStorage.getItem('wealdstone_matchday_pack');checks.push(['Matchday pack',!!raw]);checks.push(['Saved plays',safeSavedPlays().length>0]);checks.push(['Players',players.length>=11]);checks.push(['Pitch',!!pitch]);checks.push(['Ball',!!ball]);}catch(e){checks.push(['Storage',false])}var ok=checks.filter(function(x){return x[1]}).length;status.textContent='System check: '+ok+'/'+checks.length+' core systems ready.';return ok===checks.length}function openMainMenu(){var m=document.getElementById('mainMenu');if(!m){m=document.createElement('div');m.id='mainMenu';m.style='display:none;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.94);color:#fff;padding:20px;overflow:auto;text-align:left';document.body.appendChild(m)}m.innerHTML='<div style="max-width:560px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0">⚽ Coach Menu</h1><button onclick="closeMainMenu()">✕</button></div><p style="opacity:.75">All coaching tools, organised by job.</p><h3>TEAM</h3><div style="display:grid;gap:8px"><button onclick="openSquadHub();closeMainMenu()">👥 Squad Manager</button><button onclick="openTeamManager();closeMainMenu()">🧤 Starting XI</button><button onclick="openCoachHub();closeMainMenu()">🧠 Coach Hub</button></div><h3>TACTICS</h3><div style="display:grid;gap:8px"><button onclick="startSequence();closeMainMenu()">⏺ Record Play</button><button onclick="finishSequence();closeMainMenu()">⏹ Finish Recording</button><button onclick="buildBackTemplate();closeMainMenu()">🏗 Build from Back</button><button onclick="toggleOneTouch();closeMainMenu()">1️⃣ One-Touch</button><button onclick="openPlayMenu();closeMainMenu()">▶ Play Library</button></div><h3>MATCHDAY</h3><div style="display:grid;gap:8px"><button onclick="openSessionHub();closeMainMenu()">📋 Session Planner</button><button onclick="openMatchdayHub();closeMainMenu()">🏟 Matchday Hub</button><button onclick="matchdayMode(this);closeMainMenu()">🎯 Matchday Board</button></div><h3>FILE & BOARD</h3><div style="display:grid;gap:8px"><button onclick="saveTactic();closeMainMenu()">💾 Save Tactic</button><button onclick="loadTactic();closeMainMenu()">📂 Load Tactic</button><button onclick="exportTactic();closeMainMenu()">⬇ Export Tactic</button><button onclick="shareTactic();closeMainMenu()">↗ Share Tactic</button><button onclick="undo();closeMainMenu()">↶ Undo</button><button class="danger" onclick="resetBoard();closeMainMenu()">♻ Reset Board</button></div></div>';m.style.display='block'}function closeMainMenu(){var m=document.getElementById('mainMenu');if(m)m.style.display='none'}function openCoachHub(){let s=JSON.parse(localStorage.getItem("wealdstone_starting11")||"[]");document.getElementById("coachChecklist").innerHTML="<b>Start 11:</b> "+(s.length===11?"Ready":"Not selected")+"<br><b>Formation:</b> "+currentFormation+"<br><b>Saved plays:</b> "+safeSavedPlays().length+"<br><b>Current sequence:</b> "+sequence.length+" steps";document.getElementById("coachHub").style.display="block"}function closeCoachHub(){document.getElementById("coachHub").style.display="none"}function openTeamManager(){let box=document.getElementById("teamList");box.innerHTML=players.map((p,i)=>'<div style="display:flex;align-items:center;gap:8px;margin:7px 0"><input type="checkbox" id="starter'+i+'" '+(i<11?'checked':'')+'><input id="teamname'+i+'" value="'+String(names[i]||"Player "+(i+1)).replace(/"/g,"&quot;")+'" style="flex:1;padding:9px;border-radius:7px"></div>').join("");document.getElementById("teamManager").style.display="block"}
function closeTeamManager(){document.getElementById("teamManager").style.display="none"}
function applyStarting11(){let selected=[];players.forEach((p,i)=>{if(document.getElementById("starter"+i)?.checked)selected.push(i);let n=document.getElementById("teamname"+i)?.value.trim();if(n)names[i]=n});if(selected.length!==11){status.textContent="Select exactly 11 players for the Start 11.";return}players.forEach((p,i)=>p.style.opacity=selected.includes(i)?"1":".45");localStorage.setItem("wealdstone_starting11",JSON.stringify(selected));renderNames();closeTeamManager();status.textContent="Starting 11 saved."}
function saveTeam(){let team={names:[...names],starting11:JSON.parse(localStorage.getItem("wealdstone_starting11")||"[]")};localStorage.setItem("wealdstone_team",JSON.stringify(team));status.textContent="Team saved on this phone."}
function loadTeam(){let raw=localStorage.getItem("wealdstone_team");if(!raw){status.textContent="No saved team yet.";return}try{let t=JSON.parse(raw);if(Array.isArray(t.names)){names=t.names;while(players.length<names.length)addPlayer();renderNames()}let s=Array.isArray(t.starting11)?t.starting11:[];players.forEach((p,i)=>p.style.opacity=!s.length||s.includes(i)?"1":".45");status.textContent="Saved team loaded."}catch(e){status.textContent="Could not load saved team."}}
function setFormation(name,btn){if(!formations[name])return;snapshot();currentFormation=name;document.querySelectorAll(".bar button").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active");formations[name].forEach((pos,i)=>{players[i].style.left=pos[0]+"%";players[i].style.top=pos[1]+"%"});status.textContent=name+" formation loaded."}

    };
    ball.addEventListener("pointermove",move);
    ball.addEventListener("pointerup",up,{once:true});
  });
})();

<script>
(function(){
  function state(){
    var n=Array.isArray(window.sequence)?window.sequence.length:0;
    var recording=!!window.recording;
    var el=document.getElementById('elitePlayState');
    if(el) el.textContent=(recording?'RECORDING':'READY')+' · '+n+' ACTIONS';
  }
  window.eliteRecordPlay=function(){
    try{
      if(typeof window.startSequence==='function') window.startSequence();
      window.recording=true;
      window.movementMode=true;
      if(typeof window.setCoachTool==='function') window.setCoachTool('run');
      state();
    }catch(e){console.error(e);alert('Could not start recording.');}
  };
  window.eliteFinishPlay=function(){
    try{
      if(typeof window.finishSequence==='function') window.finishSequence();
      else window.recording=false;
      window.movementMode=false; window.ballMode=false; window.arrowMode=false;
      state();
    }catch(e){console.error(e);alert('Could not finish the play.');}
  };
  window.elitePlaySequence=function(){
    try{
      if(!Array.isArray(window.sequence)||!window.sequence.length){alert('Record at least one action first.');return;}
      if(typeof window.startElitePlayback==='function') window.startElitePlayback();
      else if(typeof window.animateSequence==='function') window.animateSequence();
      state();
    }catch(e){console.error(e);alert('Could not play this sequence.');}
  };
  window.eliteShowActions=function(){
    try{
      if(typeof window.openActionList==='function') window.openActionList();
      else if(typeof window.openActionInspector==='function') window.openActionInspector();
    }catch(e){console.error(e);}
  };
  var oldStart=window.startSequence,oldFinish=window.finishSequence;
  window.startSequence=function(){var r=oldStart&&oldStart.apply(this,arguments);state();return r;};
  window.finishSequence=function(){var r=oldFinish&&oldFinish.apply(this,arguments);state();return r;};
  document.addEventListener('DOMContentLoaded',state);
  setTimeout(state,500);
})();
</script>

(function(){
  var POSKEY='wealdstone_starting11_positions_v27', FORMKEY='wealdstone_starting11_formation_v27';
  function savedXI(){try{var x=JSON.parse(localStorage.getItem('wealdstone_starting11_players_v26')||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
  function savePositions(){
    var x=savedXI(); if(x.length!==11)return;
    var positions=players.map(function(p,i){return {left:p.style.left,top:p.style.top}});
    localStorage.setItem(POSKEY,JSON.stringify(positions));
    localStorage.setItem(FORMKEY,currentFormation);
    status.textContent='Starting XI positions saved.';
  }
  function loadPositions(){
    try{
      var x=savedXI(),pos=JSON.parse(localStorage.getItem(POSKEY)||'[]');
      if(x.length!==11||!Array.isArray(pos)||pos.length!==11)return;
      x.sort(function(a,b){return a.slot-b.slot}).forEach(function(p,i){names[i]=p.name});
      renderNames();
      pos.forEach(function(v,i){if(players[i]&&v.left&&v.top){players[i].style.left=v.left;players[i].style.top=v.top}});
      status.textContent='Saved Starting XI and positions loaded.';
    }catch(e){}
  }
  window.v27SaveXIPositions=savePositions;
  window.v27LoadXIPositions=loadPositions;
  document.addEventListener('pointerup',function(e){
    if(e.target&&e.target.closest&&e.target.closest('.player'))setTimeout(savePositions,30);
  });
  window.addEventListener('load',function(){setTimeout(loadPositions,850)});
})();
</script>

<!-- v28 MATCHDAY BENCH + SUBSTITUTIONS -->
<script>
(function(){
  var SQUAD='wealdstone_squad_players_v26', XI='wealdstone_starting11_players_v26',
      POS='wealdstone_starting11_positions_v27', FORM='wealdstone_starting11_formation_v27';
  var selectedBench=null;

  function read(k,f){try{var x=JSON.parse(localStorage.getItem(k)||'null');return x==null?f:x}catch(e){return f}}
  function squad(){var x=read(SQUAD,[]);return Array.isArray(x)?x:[]}
  function starting(){var x=read(XI,[]);return Array.isArray(x)?x:[]}
  function saveXI(x){localStorage.setItem(XI,JSON.stringify(x))}
  function savePositions(){
    if(typeof players==='undefined'||players.length!==11)return;
    localStorage.setItem(POS,JSON.stringify(players.map(function(p){return{left:p.style.left,top:p.style.top}})));
    localStorage.setItem(FORM,currentFormation||'433');
  }
  function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  function bench(){
    var x=starting().map(function(p){return p.id});
    return squad().filter(function(p){return x.indexOf(p.id)===-1});
  }

  function renderXI(){
    var x=starting().slice().sort(function(a,b){return (a.slot||0)-(b.slot||0)});
    var b=bench(),m=document.getElementById('squadManagerV26');
    if(!m)return;
    m.querySelector('#v26List').innerHTML=
      '<h3>Starting XI</h3>'+
      (x.length?x.map(function(p,i){
        return '<div class="v28-xi" data-slot="'+i+'"><b>'+(i+1)+'. '+esc(p.name)+'</b><span>#'+esc(p.number)+' · '+esc(p.position||'POS')+'</span><button type="button" onclick="v28SelectBenchTarget('+i+')">Replace</button></div>';
      }).join(''):'No Starting XI saved yet.')+
      '<h3 style="margin-top:16px">Bench / Substitutes</h3>'+
      '<p id="v28SubHint" style="opacity:.75">Tap a bench player, then tap Replace on the player coming off.</p>'+
      '<div id="v28Bench">'+
      (b.length?b.map(function(p){
        return '<button type="button" class="v28-bench" data-bench="'+esc(p.id)+'" onclick="v28SelectBench(\''+String(p.id).replace(/'/g,"\\'")+'\')"><b>#'+esc(p.number)+'</b> '+esc(p.name)+'<span>'+esc(p.position||'POS')+'</span></button>';
      }).join(''):'<div style="opacity:.7">No substitutes available.</div>')+
      '</div>'+
      '<div style="display:flex;gap:7px;margin-top:12px"><button class="primary" onclick="v28SaveTeam()">💾 Save Team</button><button onclick="v26Open()">← Squad</button></div>';
    m.querySelector('#v26Count').textContent=x.length===11?'11/11 selected · '+b.length+' on bench':'Select exactly 11 players';
  }

  window.v28SelectBench=function(id){
    selectedBench=id;
    document.querySelectorAll('.v28-bench').forEach(function(b){b.classList.toggle('selected',b.getAttribute('data-bench')===id)});
    var p=bench().find(function(x){return x.id===id});
    var h=document.getElementById('v28SubHint');
    if(h)h.textContent=p?'Substitution selected: '+p.name+' — now tap Replace on the player coming off.':'Select a bench player.';
  };

  window.v28SelectBenchTarget=function(slot){
    if(!selectedBench){status.textContent='Select a bench player first.';return}
    var x=starting().slice().sort(function(a,b){return (a.slot||0)-(b.slot||0)});
    var s=squad(),incoming=s.find(function(p){return p.id===selectedBench});
    if(!incoming||!x[slot]){status.textContent='Substitution could not be completed.';return}
    var outgoing=x[slot];
    var left=players[slot]?players[slot].style.left:'',top=players[slot]?players[slot].style.top:'';
    incoming=Object.assign({},incoming,{slot:slot});
    x[slot]=incoming;
    saveXI(x);
    if(typeof names!=='undefined'){names[slot]=incoming.name;renderNames()}
    if(left&&top&&players[slot]){players[slot].style.left=left;players[slot].style.top=top}
    savePositions();
    selectedBench=null;
    status.textContent=incoming.name+' on for '+outgoing.name+'.';
    renderXI();
  };

  window.v28SaveTeam=function(){
    var x=starting(); if(x.length!==11){status.textContent='Starting XI must contain exactly 11 players.';return}
    saveXI(x); savePositions(); status.textContent='Starting XI and bench saved.'; renderXI();
  };

  window.v28OpenXI=function(){
    var m=document.getElementById('squadManagerV26');
    if(!m)return;
    m.style.display='block';
    selectedBench=null;
    renderXI();
  };

  window.v26OpenXI=v28OpenXI;

  window.v28OpenBench=function(){v28OpenXI()};

  window.v28LoadTeam=function(){
    try{
      var f=localStorage.getItem(FORM);
      if(f&&typeof setFormation==='function'&&formations[f])setFormation(f);
      var x=starting().slice().sort(function(a,b){return (a.slot||0)-(b.slot||0)});
      x.forEach(function(p,i){if(typeof names!=='undefined')names[i]=p.name});
      if(typeof renderNames==='function')renderNames();
      var pos=read(POS,[]);
      if(Array.isArray(pos)&&pos.length===11)pos.forEach(function(v,i){if(players[i]&&v.left&&v.top){players[i].style.left=v.left;players[i].style.top=v.top}});
    }catch(e){}
  };

  var style=document.createElement('style');
  style.textContent='.v28-xi{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px;margin:6px 0;background:#171c24;border:1px solid #303744;border-radius:10px}.v28-xi span{font-size:12px;opacity:.7}.v28-xi button,.v28-bench{touch-action:manipulation}.v28-bench{display:flex;align-items:center;gap:8px;width:100%;padding:11px;margin:6px 0;background:#171c24;color:#fff;border:1px solid #303744;border-radius:10px;text-align:left}.v28-bench span{margin-left:auto;font-size:12px;opacity:.7}.v28-bench.selected{outline:2px solid #fff;background:#222b38}';
  document.head.appendChild(style);

  document.addEventListener('pointerup',function(e){
    var target=e.target&&e.target.closest?e.target.closest('.player'):null;
    if(!target||!selectedBench||typeof players==='undefined')return;
    var slot=players.indexOf(target);
    if(slot>=0){e.preventDefault();v28SelectBenchTarget(slot)}
  },true);

  window.addEventListener('load',function(){setTimeout(v28LoadTeam,950)});
})();
</script>

<script>
(function(){
  function placeBall(x,y){
    x=Math.max(3,Math.min(97,Number(x)||50));y=Math.max(4,Math.min(96,Number(y)||50));
    ballX=x;ballY=y;ball.style.left=x+'%';ball.style.top=y+'%';
    try{localStorage.setItem('wealdstone_board_ball_v36',JSON.stringify({x:x,y:y}))}catch(e){}
  }
  function loadBall(){
    try{var v=JSON.parse(localStorage.getItem('wealdstone_board_ball_v36')||'null');if(v&&isFinite(v.x)&&isFinite(v.y)){placeBall(v.x,v.y);return}}catch(e){}
    placeBall(ballX,ballY);
  }
  window.v36PlaceBall=placeBall;
  var oldSetCoachTool=window.setCoachTool;
  window.setCoachTool=function(kind){
    if(typeof oldSetCoachTool==='function')oldSetCoachTool.apply(this,arguments);
    if(kind==='ball')placeBall(ballX,ballY);
  };
  var oldV34=window.v34Mode;
  window.v34Mode=function(mode){
    if(typeof oldV34==='function')oldV34.apply(this,arguments);
    if(mode==='ball')placeBall(ballX,ballY);
  };
  function wireBall(){
    if(!ball||ball.dataset.v36)return;
    ball.dataset.v36='1';
    placeBall(ballX,ballY);
    ball.addEventListener('pointerup',function(){placeBall(ballX,ballY)},true);
  }
  window.addEventListener('load',function(){
    setTimeout(loadBall,180);
    setTimeout(wireBall,220);
    setTimeout(function(){if(typeof v33SyncTeamToBoard==='function')v33SyncTeamToBoard()},500);
  });
  setTimeout(loadBall,400);setTimeout(wireBall,450);
})();
</script>

<style>

<script>
(function(){
  var KEY='wealdstone_board_autosave_v37',timer=null,loading=false;
  function setSaved(msg){var el=document.getElementById('v37SaveLabel');if(el){el.textContent=msg||'BOARD SAVED';el.className='saved'}}
  function save(){if(loading||typeof getState!=='function')return;try{localStorage.setItem(KEY,JSON.stringify({version:37,savedAt:Date.now(),state:getState()}));setSaved('✓ BOARD SAVED')}catch(e){}}
  function queue(){clearTimeout(timer);timer=setTimeout(save,180)}
  window.v37SaveBoard=save;
  window.v37LoadBoard=function(){try{var raw=localStorage.getItem(KEY);if(!raw)return false;var d=JSON.parse(raw);if(d&&d.state&&typeof applyState==='function'){loading=true;applyState(d.state);loading=false;setSaved('✓ BOARD RESTORED');return true}}catch(e){loading=false}return false};
  function build(){
    if(document.getElementById('v37SaveState'))return;
    var rail=document.getElementById('v34Tools');if(!rail)return;
    var el=document.createElement('div');el.id='v37SaveState';el.innerHTML='<span id="v37SaveLabel">AUTO-SAVE ON</span><button type="button" onclick="v37SaveBoard()">SAVE NOW</button>';
    rail.parentNode.insertBefore(el,rail);
  }
  var oldSetFormation=window.setFormation;
  window.setFormation=function(){var r=typeof oldSetFormation==='function'?oldSetFormation.apply(this,arguments):undefined;queue();return r};
  var oldUndo=window.undo;
  window.undo=function(){var r=typeof oldUndo==='function'?oldUndo.apply(this,arguments):undefined;queue();return r};
  var oldSaveTactic=window.saveTactic;
  window.saveTactic=function(){var r=typeof oldSaveTactic==='function'?oldSaveTactic.apply(this,arguments):undefined;save();return r};
  var oldApply=window.applyState;
  window.applyState=function(d){var r=typeof oldApply==='function'?oldApply.apply(this,arguments):undefined;queue();return r};
  window.v34Mode=function(mode){
    var id=mode==='move'?'v34Move':mode==='ball'?'v34Ball':'v34Pass';
    ['v34Move','v34Ball','v34Pass'].forEach(function(x){var e=document.getElementById(x);if(e)e.classList.toggle('active',x===id)});
    if(mode==='move'){
      if(typeof setCoachTool==='function')setCoachTool('none');
      if(typeof status!=='undefined')status.textContent='MOVE MODE — drag players. No run recorded.';
    }else if(typeof setCoachTool==='function')setCoachTool(mode);
  };
  document.addEventListener('pointerup',function(e){if(e.target&&((e.target.classList&&e.target.classList.contains('player'))||(e.target.id==='pitch')||(e.target.classList&&e.target.classList.contains('ball'))))queue()},true);
  document.addEventListener('input',function(e){if(e.target&&e.target.id==='notes')queue()},true);
  window.addEventListener('load',function(){
    setTimeout(build,650);
    setTimeout(function(){if(typeof v33SyncTeamToBoard==='function')v33SyncTeamToBoard()},900);
    setTimeout(function(){v37LoadBoard();if(typeof v33SyncTeamToBoard==='function')v33SyncTeamToBoard();setTimeout(function(){v37LoadBoard();save()},80)},1500);
  });
  setTimeout(build,900);
})();
</script>

  function installBallTap(){
    var p=document.getElementById('pitch');
    if(!p||p.__v40BallTap)return;
    p.__v40BallTap=true;
    p.addEventListener('pointerdown',function(e){
      if(typeof ballMode==='undefined'||!ballMode)return;
      if(e.target.closest && (e.target.closest('.player')||e.target.closest('.ball')||e.target.closest('#v34Tools')))return;
      var r=p.getBoundingClientRect();
      var x=Math.max(2,Math.min(98,(e.clientX-r.left)/r.width*100));
      var y=Math.max(2,Math.min(98,(e.clientY-r.top)/r.height*100));
      if(typeof ballX!=='undefined')ballX=x;
      if(typeof ballY!=='undefined')ballY=y;
      var b=document.getElementById('ball');
      if(b){b.style.display='block';b.style.left=x+'%';b.style.top=y+'%';}
      saveLive();
      if(typeof status!=='undefined')status.textContent='Ball placed.';
    },{passive:true});
  }

  /* Make state restore refresh the visual board and active formation reliably. */
  var originalApply=window.applyState;

<!-- V44 BOARD READY + MOVEMENT VISUAL RELIABILITY -->
<script>
(function(){
  function placeInitialBoard(){
    try{
      if(typeof players!=="undefined" && typeof formations!=="undefined"){
        var pos=formations[currentFormation||"433"]||formations["433"];
        players.slice(0,11).forEach(function(p,i){
          if(p && pos && pos[i]){
            if(!p.style.left || !p.style.top || p.style.left==="0px" || p.style.top==="0px"){
              p.style.left=pos[i][0]+"%";
              p.style.top=pos[i][1]+"%";
            }
          }
        });
      }
      if(typeof ball!=="undefined" && ball){
        ball.style.display="block";
        ball.style.left=(typeof ballX==="number"?ballX:50)+"%";
        ball.style.top=(typeof ballY==="number"?ballY:50)+"%";
      }
      if(typeof renderNames==="function")renderNames();
      if(typeof drawArrows==="function")drawArrows();
    }catch(e){}
  }

  function saveBoard(){
    try{
      if(typeof getState==="function"){
        var state=getState();
        localStorage.setItem("wealdstone_live_tactic",JSON.stringify(state));
      }
    }catch(e){}
  }

  window.v44BoardReady=placeInitialBoard;

  window.addEventListener("DOMContentLoaded",function(){
    setTimeout(placeInitialBoard,50);
    setTimeout(placeInitialBoard,400);
  });
  window.addEventListener("load",function(){
    setTimeout(placeInitialBoard,100);
    setTimeout(placeInitialBoard,900);
    setTimeout(function(){
      if(typeof v34Mode==="function")v34Mode("move");
    },1000);
  });

  /* Make Movement mode unambiguous: every completed player drag draws a visible run. */
  document.addEventListener("pointerup",function(e){
    if(!e.target || !e.target.closest)return;
    var p=e.target.closest(".player");
    if(p && typeof movementMode!=="undefined" && movementMode){
      setTimeout(function(){
        try{
          if(typeof drawArrows==="function")drawArrows();
          saveBoard();
        }catch(_){}
      },60);
    }
  });

  /* Keep the ball visible after any board update. */
  var oldApply=window.applyState;
  if(typeof oldApply==="function"){
    window.applyState=function(d){
      var r=oldApply.apply(this,arguments);
      setTimeout(placeInitialBoard,30);
      return r;
    };
  }
})();
</script>
