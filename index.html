.panel{width:94%;max-width:720px;margin:8px auto;text-align:left}.panel textarea{width:100%;min-height:75px;border-radius:8px;padding:10px;font:14px Arial}.status{font-size:12px;color:#aaa;margin:4px}

 .app-header{padding:10px 12px 5px}.app-header img{width:48px!important;height:48px!important}.app-title h1{font-size:18px}

<script>
const pitch=document.getElementById("pitch"),svg=document.getElementById("arrows"),notes=document.getElementById("notes"),status=document.getElementById("status");
const formations={433:[[50,88],[18,72],[38,76],[62,76],[82,72],[30,57],[50,62],[70,57],[18,32],[50,25],[82,32]],442:[[50,88],[18,72],[38,76],[62,76],[82,72],[18,52],[38,57],[62,57],[82,52],[35,30],[65,30]],352:[[50,88],[25,72],[50,76],[75,72],[15,55],[35,58],[50,52],[65,58],[85,55],[35,30],[65,30]],4231:[[50,88],[18,72],[38,76],[62,76],[82,72],[35,58],[65,58],[18,36],[50,42],[82,36],[50,25]],4141:[[50,88],[18,72],[38,76],[62,76],[82,72],[50,63],[18,43],[38,48],[62,48],[82,43],[50,25]]};
let players=[],names=Array.from({length:11},(_,i)=>"Player "+(i+1)),arrowMode=false,arrowStart=null,movementMode=false,currentFormation="433",arrows=[],history=[],oppositionMode=false,deferredInstallPrompt=null;
let sequence=[],recording=false,playStep=0,ballX=50,ballY=50,ballMode=false,oneTouch=false,oneTouchPlayer=null;let ball=document.createElement("div");ball.className="ball";ball.textContent="⚽";ball.setAttribute("aria-label","Tactical ball");pitch.appendChild(ball);let playTimer=null,playIndex=0,playing=false,playStart=0,playDuration=900;for(let i=0;i<11;i++){let p=document.createElement("div");p.className="player"+(i===0?" gk":"");p.innerHTML='<span class="num">'+(i+1)+'</span><span class="name"></span>';pitch.appendChild(p);players.push(p);makeDraggable(p);p.ondblclick=()=>renameOne(i)}
function renderNames(){players.forEach((p,i)=>{p.querySelector(".name").textContent=names[i]||("Player "+(i+1));p.querySelector(".num").textContent=i+1})}
function openSessionHub(){var plays=safeSavedPlays(),m=document.getElementById('sessionHub');if(!m){m=document.createElement('div');m.id='sessionHub';m.style='display:none;position:fixed;inset:4%;z-index:80;background:#111;color:#fff;border:2px solid #fff;border-radius:14px;padding:16px;overflow:auto;text-align:left';document.body.appendChild(m)}var h='<h2>Session Planner</h2><p>Organise your saved plays into a coaching session.</p><label>Session name</label><input id="sessionName" value="Match Session" style="width:100%;padding:9px;margin:6px 0 12px"><label>Focus</label><select id="sessionPhase" style="width:100%;padding:9px;margin:6px 0 12px"><option>Build-up</option><option>Attack</option><option>Defend</option><option>Transition</option><option>Set Piece</option></select><h3>Saved plays</h3>'+(plays.length?plays.map(function(p,i){return '<label style="display:block;padding:7px"><input type="checkbox" class="sessionPlay" value="'+i+'"> '+String(p.name||('Play '+(i+1))).replace(/</g,'&lt;')+'</label>'}).join(''):'No saved plays yet.')+'<br><button onclick="saveSessionPlan()">💾 Save Session</button> <button onclick="closeSessionHub()">Close</button>';m.innerHTML=h;m.style.display='block'}function closeSessionHub(){var m=document.getElementById('sessionHub');if(m)m.style.display='none'}function saveSessionPlan(){var plan={name:(document.getElementById('sessionName').value||'Match Session').trim(),phase:document.getElementById('sessionPhase').value,plays:[].slice.call(document.querySelectorAll('.sessionPlay:checked')).map(function(x){return +x.value})};localStorage.setItem('wealdstone_session_plan',JSON.stringify(plan));status.textContent='Session plan saved on this phone.';closeSessionHub()}function saveMatchdayPack(){var pack={team:JSON.parse(localStorage.getItem('wealdstone_team')||'{}'),squad:JSON.parse(localStorage.getItem('wealdstone_squad_profile')||'[]'),starting11:JSON.parse(localStorage.getItem('wealdstone_starting11')||'[]'),captain:localStorage.getItem('wealdstone_captain')||'',tactic:getState(),session:JSON.parse(localStorage.getItem('wealdstone_session_plan')||'{}')};localStorage.setItem('wealdstone_matchday_pack',JSON.stringify(pack));status.textContent='Complete matchday pack saved on this phone.'}function loadMatchdayPack(){var raw=localStorage.getItem('wealdstone_matchday_pack');if(!raw){status.textContent='No matchday pack saved yet.';return}try{var p=JSON.parse(raw);if(p.tactic)applyState(p.tactic);if(Array.isArray(p.starting11))localStorage.setItem('wealdstone_starting11',JSON.stringify(p.starting11));if(p.captain!==undefined)localStorage.setItem('wealdstone_captain',p.captain);if(p.squad)localStorage.setItem('wealdstone_squad_profile',JSON.stringify(p.squad));if(p.session)localStorage.setItem('wealdstone_session_plan',JSON.stringify(p.session));status.textContent='Complete matchday pack loaded.'}catch(e){status.textContent='Could not load matchday pack.'}}function openMatchdayHub(){var m=document.getElementById('matchdayHub');if(!m){m=document.createElement('div');m.id='matchdayHub';m.style='display:none;position:fixed;inset:3%;z-index:90;background:#111;color:#fff;border:2px solid #fff;border-radius:14px;padding:16px;overflow:auto;text-align:left';document.body.appendChild(m)}var s=JSON.parse(localStorage.getItem('wealdstone_starting11')||'[]'),cap=localStorage.getItem('wealdstone_captain')||'';m.innerHTML='<h2>🏟 Matchday</h2><p><b>Formation:</b> '+currentFormation+'</p><h3>Starting XI</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+players.map(function(p,i){return '<div style="padding:7px;border-radius:8px;background:'+(s.includes(i)?'#164':'#333')+'">'+(s.includes(i)?'XI':'BENCH')+' — '+String(names[i]||('Player '+(i+1))).replace(/</g,'&lt;')+'</div>'}).join('')+'</div><h3>Captain</h3><select id="captainSelect" style="width:100%;padding:10px">'+players.map(function(p,i){return '<option value="'+i+'" '+(cap==i?'selected':'')+'>'+String(names[i]||('Player '+(i+1))).replace(/</g,'&lt;')+'</option>'}).join('')+'</select><br><br><button onclick="saveCaptain()">💾 Save Captain</button> <button onclick="closeMatchdayHub()">Close</button>';m.style.display='block'}function closeMatchdayHub(){var m=document.getElementById('matchdayHub');if(m)m.style.display='none'}function saveCaptain(){var x=document.getElementById('captainSelect');localStorage.setItem('wealdstone_captain',x.value);status.textContent='Captain saved.';closeMatchdayHub()}function openSquadHub(){var m=document.getElementById('squadHub');if(!m){m=document.createElement('div');m.id='squadHub';m.style='display:none;position:fixed;inset:3%;z-index:95;background:#111;color:#fff;border:2px solid #fff;border-radius:14px;padding:16px;overflow:auto;text-align:left';document.body.appendChild(m)}m.innerHTML='<h2>👥 Squad Manager</h2><p>Edit shirt numbers, positions and roles.</p>'+players.map(function(p,i){return '<div style="display:grid;grid-template-columns:55px 1fr 1fr 1fr;gap:6px;margin:7px 0"><input id="sn'+i+'" value="'+(i+1)+'" inputmode="numeric" style="padding:8px"><input id="sp'+i+'" value="'+String(names[i]||('Player '+(i+1))).replace(/"/g,'&quot;')+'" style="padding:8px"><select id="spos'+i+'" style="padding:8px"><option>GK</option><option>DEF</option><option>MID</option><option>WING</option><option>FWD</option></select><select id="srole'+i+'" style="padding:8px"><option>Starter</option><option>Bench</option><option>Captain</option></select></div>'}).join('')+'<br><button onclick="saveSquadProfile()">💾 Save Squad</button> <button onclick="closeSquadHub()">Close</button>';m.style.display='block'}function closeSquadHub(){var m=document.getElementById('squadHub');if(m)m.style.display='none'}function saveSquadProfile(){var profile=[];players.forEach(function(p,i){names[i]=(document.getElementById('sp'+i).value||('Player '+(i+1))).trim();profile.push({number:+document.getElementById('sn'+i).value||i+1,name:names[i],position:document.getElementById('spos'+i).value,role:document.getElementById('srole'+i).value})});localStorage.setItem('wealdstone_squad_profile',JSON.stringify(profile));renderNames();status.textContent='Squad profile saved.';closeSquadHub()}function coachHealthCheck(){var checks=[],raw;try{raw=localStorage.getItem('wealdstone_matchday_pack');checks.push(['Matchday pack',!!raw]);checks.push(['Saved plays',safeSavedPlays().length>0]);checks.push(['Players',players.length>=11]);checks.push(['Pitch',!!pitch]);checks.push(['Ball',!!ball]);}catch(e){checks.push(['Storage',false])}var ok=checks.filter(function(x){return x[1]}).length;status.textContent='System check: '+ok+'/'+checks.length+' core systems ready.';return ok===checks.length}function openMainMenu(){var m=document.getElementById('mainMenu');if(!m){m=document.createElement('div');m.id='mainMenu';m.style='display:none;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.94);color:#fff;padding:20px;overflow:auto;text-align:left';document.body.appendChild(m)}m.innerHTML='<div style="max-width:560px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0">⚽ Coach Menu</h1><button onclick="closeMainMenu()">✕</button></div><p style="opacity:.75">All coaching tools, organised by job.</p><h3>TEAM</h3><div style="display:grid;gap:8px"><button onclick="openSquadHub();closeMainMenu()">👥 Squad Manager</button><button onclick="openTeamManager();closeMainMenu()">🧤 Starting XI</button><button onclick="openCoachHub();closeMainMenu()">🧠 Coach Hub</button></div><h3>TACTICS</h3><div style="display:grid;gap:8px"><button onclick="startSequence();closeMainMenu()">⏺ Record Play</button><button onclick="finishSequence();closeMainMenu()">⏹ Finish Recording</button><button onclick="buildBackTemplate();closeMainMenu()">🏗 Build from Back</button><button onclick="toggleOneTouch();closeMainMenu()">1️⃣ One-Touch</button><button onclick="openPlayMenu();closeMainMenu()">▶ Play Library</button></div><h3>MATCHDAY</h3><div style="display:grid;gap:8px"><button onclick="openSessionHub();closeMainMenu()">📋 Session Planner</button><button onclick="openMatchdayHub();closeMainMenu()">🏟 Matchday Hub</button><button onclick="matchdayMode(this);closeMainMenu()">🎯 Matchday Board</button></div><h3>FILE & BOARD</h3><div style="display:grid;gap:8px"><button onclick="saveTactic();closeMainMenu()">💾 Save Tactic</button><button onclick="loadTactic();closeMainMenu()">📂 Load Tactic</button><button onclick="exportTactic();closeMainMenu()">⬇ Export Tactic</button><button onclick="shareTactic();closeMainMenu()">↗ Share Tactic</button><button onclick="undo();closeMainMenu()">↶ Undo</button><button class="danger" onclick="resetBoard();closeMainMenu()">♻ Reset Board</button></div></div>';m.style.display='block'}function closeMainMenu(){var m=document.getElementById('mainMenu');if(m)m.style.display='none'}function openCoachHub(){let s=JSON.parse(localStorage.getItem("wealdstone_starting11")||"[]");document.getElementById("coachChecklist").innerHTML="<b>Start 11:</b> "+(s.length===11?"Ready":"Not selected")+"<br><b>Formation:</b> "+currentFormation+"<br><b>Saved plays:</b> "+safeSavedPlays().length+"<br><b>Current sequence:</b> "+sequence.length+" steps";document.getElementById("coachHub").style.display="block"}function closeCoachHub(){document.getElementById("coachHub").style.display="none"}function openTeamManager(){let box=document.getElementById("teamList");box.innerHTML=players.map((p,i)=>'<div style="display:flex;align-items:center;gap:8px;margin:7px 0"><input type="checkbox" id="starter'+i+'" '+(i<11?'checked':'')+'><input id="teamname'+i+'" value="'+String(names[i]||"Player "+(i+1)).replace(/"/g,"&quot;")+'" style="flex:1;padding:9px;border-radius:7px"></div>').join("");document.getElementById("teamManager").style.display="block"}
function closeTeamManager(){document.getElementById("teamManager").style.display="none"}
function applyStarting11(){let selected=[];players.forEach((p,i)=>{if(document.getElementById("starter"+i)?.checked)selected.push(i);let n=document.getElementById("teamname"+i)?.value.trim();if(n)names[i]=n});if(selected.length!==11){status.textContent="Select exactly 11 players for the Start 11.";return}players.forEach((p,i)=>p.style.opacity=selected.includes(i)?"1":".45");localStorage.setItem("wealdstone_starting11",JSON.stringify(selected));renderNames();closeTeamManager();status.textContent="Starting 11 saved."}
function saveTeam(){let team={names:[...names],starting11:JSON.parse(localStorage.getItem("wealdstone_starting11")||"[]")};localStorage.setItem("wealdstone_team",JSON.stringify(team));status.textContent="Team saved on this phone."}
function loadTeam(){let raw=localStorage.getItem("wealdstone_team");if(!raw){status.textContent="No saved team yet.";return}try{let t=JSON.parse(raw);if(Array.isArray(t.names)){names=t.names;while(players.length<names.length)addPlayer();renderNames()}let s=Array.isArray(t.starting11)?t.starting11:[];players.forEach((p,i)=>p.style.opacity=!s.length||s.includes(i)?"1":".45");status.textContent="Saved team loaded."}catch(e){status.textContent="Could not load saved team."}}
function setFormation(name,btn){if(!formations[name])return;snapshot();currentFormation=name;document.querySelectorAll(".bar button").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active");formations[name].forEach((pos,i)=>{players[i].style.left=pos[0]+"%";players[i].style.top=pos[1]+"%"});status.textContent=name+" formation loaded."}

function undo(){let s=history.pop();if(!s){status.textContent="Nothing to undo.";return}let d;try{d=JSON.parse(s)}catch(e){status.textContent="Saved tactic is damaged.";return}currentFormation=d.formation||"433";names=d.names||names;notes.value=d.notes||"";d.positions?.forEach((x,i)=>{if(players[i]){players[i].style.left=x.left;players[i].style.top=x.top}});arrows=d.arrows||[];renderNames();drawArrows();status.textContent="Undone."}
function makeDraggable(el){let startX,startY,dragged=false,oldLeft,oldTop,preDragState=null;const move=e=>{let r=pitch.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;el.style.left=Math.max(3,Math.min(97,x))+"%";el.style.top=Math.max(4,Math.min(96,y))+"%";drawArrows()};el.addEventListener("pointerdown",e=>{if(arrowMode){chooseArrow(el);e.preventDefault();return}let r=pitch.getBoundingClientRect();startX=(e.clientX-r.left)/r.width*100;startY=(e.clientY-r.top)/r.height*100;oldLeft=el.style.left;oldTop=el.style.top;preDragState=getState();dragged=false;selectPlayer(players.indexOf(el));el.setPointerCapture(e.pointerId);const mm=ev=>{dragged=true;move(ev)};const up=ev=>{el.removeEventListener("pointermove",mm);el.removeEventListener("pointerup",up);el.classList.remove("selected");if(dragged){let rr=pitch.getBoundingClientRect(),endX=(ev.clientX-rr.left)/rr.width*100,endY=(ev.clientY-rr.top)/rr.height*100;endX=Math.max(3,Math.min(97,endX));endY=Math.max(4,Math.min(96,endY));if(preDragState){history.push(JSON.stringify(preDragState));if(history.length>30)history.shift()}if(movementMode){let pi=players.indexOf(el);arrows.push({type:"move",playerIndex:pi,x1:startX,y1:startY,x2:endX,y2:endY,curve:0.18});recordRun(pi);status.textContent="Run added. Drag again to add another movement.";}else{status.textContent="Player moved.";}drawArrows();}};el.addEventListener("pointermove",mm);el.addEventListener("pointerup",up,{once:true})})}
function addPlayer(){if(players.length>=18){status.textContent="Maximum 18 players reached.";return}let i=players.length;let p=document.createElement("div");p.className="player";p.innerHTML='<span class="num"></span><span class="name"></span>';pitch.appendChild(p);players.push(p);names.push("Player "+(i+1));p.querySelector(".num").textContent=i+1;p.ondblclick=()=>renameOne(i);makeDraggable(p);p.style.left="50%";p.style.top="50%";renderNames();status.textContent="Player added. Double-tap to rename.";}
function selectPlayer(i){oneTouchSelect(i);players.forEach(x=>x.classList.remove("selected"));if(players[i]){players[i].classList.add("selected");status.textContent=names[i]+" selected."}}
function renameOne(i){selectPlayer(i);let n=prompt("Player "+(i+1)+" name:",names[i]);if(n!==null&&n.trim()){names[i]=n.trim();renderNames();status.textContent=names[i]+" renamed."}}
function removeSelected(){let i=players.findIndex(p=>p.classList.contains("selected"));if(i<0){status.textContent="Select a player first.";return}snapshot();players[i].remove();players.splice(i,1);names.splice(i,1);players.forEach((p,j)=>{p.querySelector(".num").textContent=j+1;p.className="player"+(j===0?" gk":"");p.ondblclick=()=>renameOne(j)});renderNames();drawArrows();status.textContent="Player removed."}
function renamePlayers(){for(let i=0;i<players.length;i++){let n=prompt("Player "+(i+1)+" name:",names[i]);if(n===null)break;if(n.trim())names[i]=n.trim()}renderNames();status.textContent="Player names updated."}
function toggleMovementMode(btn){movementMode=!movementMode;arrowMode=false;arrowStart=null;btn.classList.toggle("active",movementMode);document.querySelectorAll(".bar button").forEach(b=>{if(b!==btn&&b.textContent==="Add Arrow")b.classList.remove("active")});status.textContent=movementMode?"Movement mode: drag a player to show their run.":"Movement mode off."}
function toggleArrowMode(btn){arrowMode=!arrowMode;movementMode=false;arrowStart=null;btn.classList.toggle("active",arrowMode);document.querySelectorAll(".bar button").forEach(b=>{if(b!==btn&&b.textContent==="Movement")b.classList.remove("active")});status.textContent=arrowMode?"Arrow mode: tap the start player, then the destination player.":"Arrow mode off."}
function chooseArrow(p){if(!arrowStart){arrowStart=p;players.forEach(x=>x.classList.remove("selected"));p.classList.add("selected");status.textContent="Now tap the destination player."}else if(arrowStart!==p){let a=players.indexOf(arrowStart),b=players.indexOf(p);if(a<0||b<0){arrowStart=null;return}arrows.push([a,b]);recordPass(a,b);arrowStart.classList.remove("selected");arrowStart=null;drawArrows();status.textContent=recording?"Pass added to play.":"Arrow added."}}
function startSequence(){sequence=[];recording=true;playStep=0;status.textContent="Recording: tap pass arrows/player actions in order.";document.body.classList.add("recording")}
function finishSequence(){recording=false;document.body.classList.remove("recording");status.textContent=sequence.length?"Play recorded — "+sequence.length+" steps.":"No steps recorded."}
function recordPass(a,b){if(recording)sequence.push({type:"pass",from:a,to:b})}
function recordRun(player){if(recording)sequence.push({type:"run",player})}

function importPlay(){document.getElementById("playFile").click()}
function handlePlayFile(e){const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(d.state&&d.sequence){applyState(d.state);sequence=d.sequence;status.textContent="Play imported — "+sequence.length+" steps."}else if(d.sequence){sequence=d.sequence;applyState(d)}else if(d.positions||d.formation){applyState(d);status.textContent="Tactic imported."}else throw new Error("bad format")}catch(err){status.textContent="Could not import that play file."}e.target.value=""};reader.readAsText(file)}
function buildBackTemplate(){snapshot();currentFormation="433";formations["433"].forEach((pos,i)=>{if(players[i]){players[i].style.left=pos[0]+"%";players[i].style.top=pos[1]+"%"}});arrows=[];sequence=[];const add=(a,b)=>{arrows.push([a,b]);sequence.push({type:"pass",from:a,to:b})};const run=(p,x,y)=>{let el=players[p],r=pitch.getBoundingClientRect(),rr=el.getBoundingClientRect(),sx=(rr.left+rr.width/2-r.left)/r.width*100,sy=(rr.top+rr.height/2-r.top)/r.height*100;arrows.push({type:"move",playerIndex:p,x1:sx,y1:sy,x2:x,y2:y,curve:.18});sequence.push({type:"run",player:p})};add(0,2);add(2,5);add(5,1);run(7,82,48);add(5,6);run(8,18,48);add(6,8);add(8,10);renderNames();drawArrows();ballX=50;ballY=88;ball.style.left=ballX+"%";ball.style.top=ballY+"%";status.textContent="Build-from-back template loaded — edit the runs and passes, then Save Play."}
function savePlay(){finishSequence();if(!sequence.length){status.textContent="Record a play first.";return}let name=prompt("Name this play");if(!name)return;let saved=safeSavedPlays();saved.push({id:Date.now(),name,state:getState(),sequence});localStorage.setItem("wealdstone_saved_plays",JSON.stringify(saved));status.textContent="Saved play: "+name}
function filterPlayLibrary(){var q=(document.getElementById('playSearch')?.value||'').toLowerCase(),phase=document.getElementById('playPhase')?.value||'All',items=safeSavedPlays(),box=document.getElementById('playLibraryList');if(!box)return;box.innerHTML=items.map(function(p,i){var n=String(p.name||('Play '+(i+1))),ph=p.phase||'Uncategorised';if(q&&n.toLowerCase().indexOf(q)<0)return '';if(phase!='All'&&ph!=phase)return '';return '<div style="padding:10px;margin:6px 0;background:#222;border-radius:9px"><b>'+n.replace(/</g,'&lt;')+'</b><small style="display:block;opacity:.7">'+ph+'</small><button onclick="loadSavedPlay('+i+')">Load</button> <button onclick="deleteSavedPlay('+i+')">Delete</button></div>'}).join('')||'<p>No matching plays.</p>'}function closePlayLibrary(){var m=document.getElementById('playLibraryHub');if(m)m.style.display='none'}function openPlayMenu(){let box=document.getElementById("savedPlays"),saved=safeSavedPlays().filter(p=>p&&typeof p==="object");box.innerHTML=saved.length?saved.map((p,i)=>{let n=String(p.name||"Unnamed play").replace(/</g,"&lt;");return '<div style="display:flex;gap:8px;align-items:center;margin:8px 0"><b style="flex:1">'+n+'</b><button onclick="loadSavedPlay('+i+')">Load</button><button onclick="deleteSavedPlay('+i+')">Delete</button></div>'}).join(""):"No saved plays yet.";document.getElementById("playMenu").style.display="block"}
function closePlayMenu(){document.getElementById("playMenu").style.display="none"}
function loadSavedPlay(i){let saved=safeSavedPlays(),p=saved[i];if(!p||!p.state){status.textContent="That saved play is invalid.";return}try{applyState(p.state);sequence=Array.isArray(p.sequence)?p.sequence:[];closePlayMenu();status.textContent="Loaded play: "+String(p.name||"Unnamed play")}catch(e){status.textContent="Could not load that play."}}
function deleteSavedPlay(i){let saved=safeSavedPlays();if(i<0||i>=saved.length)return;saved.splice(i,1);localStorage.setItem("wealdstone_saved_plays",JSON.stringify(saved));openPlayMenu()}
function playSequence(){if(!sequence.length){status.textContent="Record or load a play first.";return}playing=true;ball.style.display="block";playStep=0;playStart=performance.now();animateSequence();status.textContent="Playing saved play."}
function toggleOneTouch(){oneTouch=!oneTouch;oneTouchPlayer=null;status.textContent=oneTouch?"One-Touch: tap the ball player, then the receiver. Drag a player to create a run.":"One-Touch off."}
function oneTouchSelect(i){if(!oneTouch||!recording)return;if(oneTouchPlayer===null){oneTouchPlayer=i;status.textContent="Player "+(i+1)+" selected — tap the receiver.";players[i].classList.add("selected")}else if(oneTouchPlayer!==i){sequence.push({type:"pass",from:oneTouchPlayer,to:i});let r=pitch.getBoundingClientRect(),p=players[i].getBoundingClientRect();ballX=(p.left+p.width/2-r.left)/r.width*100;ballY=(p.top+p.height/2-r.top)/r.height*100;players.forEach(x=>x.classList.remove("selected"));oneTouchPlayer=i;players[i].classList.add("selected");status.textContent="Pass added — "+(i+1)+" now has the ball."}}
function toggleBallMode(){ballMode=!ballMode;ball.classList.toggle("ball-editor",ballMode);status.textContent=ballMode?"Ball mode: drag the ball to create ball movement.":"Ball mode off."}
function setupBall(){ball.classList.add("ball-editor");ball.style.display="block";ball.style.left=ballX+"%";ball.style.top=ballY+"%";let drag=false,startX=0,startY=0;ball.onpointerdown=e=>{if(!ballMode&&!recording)return;drag=true;startX=ballX;startY=ballY;ball.setPointerCapture(e.pointerId)};ball.onpointermove=e=>{if(!drag)return;let r=pitch.getBoundingClientRect();ballX=Math.max(2,Math.min(98,(e.clientX-r.left)/r.width*100));ballY=Math.max(2,Math.min(98,(e.clientY-r.top)/r.height*100));ball.style.left=ballX+"%";ball.style.top=ballY+"%"};ball.onpointerup=()=>{if(!drag)return;drag=false;if(recording&&Math.hypot(ballX-startX,ballY-startY)>2)sequence.push({type:"ball",x1:startX,y1:startY,x2:ballX,y2:ballY})}}
setupBall();
function safeSavedPlays(){try{return JSON.parse(localStorage.getItem("wealdstone_saved_plays")||"[]")}catch(e){localStorage.removeItem("wealdstone_saved_plays");return []}}
function animateSequence(){if(!playing)return;let s=sequence[playStep];if(!s){playing=false;status.textContent="Play finished.";return}let t=Math.min(1,(performance.now()-playStart)/playDuration),r=pitch.getBoundingClientRect();if(s.type==="pass"&&players[s.from]&&players[s.to]){let a=players[s.from].getBoundingClientRect(),b=players[s.to].getBoundingClientRect();ballX=(a.left+a.width/2-r.left+(b.left+b.width/2-a.left-a.width/2)*t)/r.width*100;ballY=(a.top+a.height/2-r.top+(b.top+b.height/2-a.top-a.height/2)*t)/r.height*100;if(t>=1){playStep++;playStart=performance.now()}}else if(s.type==="ball"){ballX=s.x1+(s.x2-s.x1)*t;ballY=s.y1+(s.y2-s.y1)*t;if(t>=1){playStep++;playStart=performance.now()}}else if(s.type==="run"&&players[s.player]){let run=arrows.find(a=>a&&a.type==="move"&&a.playerIndex===s.player);if(run){let p=players[s.player],rt=t<.72?t/.72:1-(t-.72)/.28;rt=Math.max(0,Math.min(1,rt));p.style.left=(run.x1+(run.x2-run.x1)*rt)+"%";p.style.top=(run.y1+(run.y2-run.y1)*rt)+"%";if(t>=1){p.style.left=run.x1+"%";p.style.top=run.y1+"%";playStep++;playStart=performance.now()}}}ball.style.left=ballX+"%";ball.style.top=ballY+"%";playTimer=requestAnimationFrame(animateSequence)}
function pauseTactic(){playing=false;players.forEach((p,i)=>{let n=sequence.find(s=>s.type==="run"&&s.player===i);if(n){let run=arrows.find(a=>a&&a.type==="move"&&a.playerIndex===i);if(run){p.style.left=run.x1+"%";p.style.top=run.y1+"%"}}});if(playTimer){cancelAnimationFrame(playTimer);playTimer=null}players.forEach(p=>p.classList.remove("run-active"));ball.style.display="block";status.textContent="Animation paused."}
function playTactic(){if(playing)return;let passes=arrows.filter(a=>Array.isArray(a)&&a.length>=2&&players[a[0]]&&players[a[1]]);if(!passes.length){status.textContent="Add pass arrows between players first.";return}playing=true;ball.style.display="block";playIndex=0;playStart=performance.now();animateTactic();status.textContent="Animation playing — ball and runs moving."}
function animateTactic(){if(!playing)return;let passes=arrows.filter(a=>Array.isArray(a)&&a.length>=2&&players[a[0]]&&players[a[1]]);if(!passes.length){pauseTactic();return}let elapsed=performance.now()-playStart;let step=Math.floor(elapsed/playDuration);if(step>=passes.length){playStart=performance.now();playIndex=0;step=0}playIndex=step;let t=(elapsed%playDuration)/playDuration,a=passes[step],A=players[a[0]],B=players[a[1]],r=pitch.getBoundingClientRect(),ra=A.getBoundingClientRect(),rb=B.getBoundingClientRect();let x1=(ra.left+ra.width/2-r.left)/r.width*100,y1=(ra.top+ra.height/2-r.top)/r.height*100,x2=(rb.left+rb.width/2-r.left)/r.width*100,y2=(rb.top+rb.height/2-r.top)/r.height*100;ball.style.left=(x1+(x2-x1)*t)+"%";ball.style.top=(y1+(y2-y1)*t)+"%";players.forEach(p=>p.classList.remove("run-active"));arrows.filter(x=>x&&x.type==="move").forEach(run=>{let px=run.x1+(run.x2-run.x1)*t,py=run.y1+(run.y2-run.y1)*t;players.forEach(p=>{let rr=p.getBoundingClientRect(),rx=(rr.left+rr.width/2-r.left)/r.width*100,ry=(rr.top+rr.height/2-r.top)/r.height*100;if(Math.hypot(rx-px,ry-py)<5)p.classList.add("run-active")})});playTimer=requestAnimationFrame(animateTactic)}
function clearArrows(){if(arrows.length)snapshot();arrows=[];arrowStart=null;players.forEach(x=>x.classList.remove("selected"));drawArrows();status.textContent="Arrows cleared."}
function drawArrows(){svg.querySelectorAll(".arrow").forEach(x=>x.remove());let r=pitch.getBoundingClientRect();arrows.forEach(a=>{if(a&&a.type==="move"){let x1=a.x1*10,y1=a.y1*7,x2=a.x2*10,y2=a.y2*7,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,off=Math.min(120,len*.22)*(a.curve||.18)/.18,cx=(x1+x2)/2-dy/len*off,cy=(y1+y2)/2+dx/len*off,p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);p.setAttribute("class","arrow");svg.appendChild(p);return}let A=players[a[0]],B=players[a[1]];if(!A||!B)return;let ra=A.getBoundingClientRect(),rb=B.getBoundingClientRect();let x1=(ra.left+ra.width/2-r.left)/r.width*1000,y1=(ra.top+ra.height/2-r.top)/r.height*700,x2=(rb.left+rb.width/2-r.left)/r.width*1000,y2=(rb.top+rb.height/2-r.top)/r.height*700,l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("class","arrow");svg.appendChild(l)})}
function getState(){return{formation:currentFormation,names:[...names],notes:notes.value,positions:players.map(p=>({left:p.style.left,top:p.style.top})),arrows:arrows.map(a=>Array.isArray(a)?[...a]:{...a}),oppositionMode,ball:{x:ballX,y:ballY},sequence:[...sequence]}}
function saveSlot(slot){snapshot();localStorage.setItem("wealdstone_"+slot,JSON.stringify(getState()));status.textContent=slot+" phase saved on this phone."}
function loadSlot(slot){let s=localStorage.getItem("wealdstone_"+slot);if(!s){status.textContent="No "+slot+" phase saved yet.";return}snapshot();applyState(JSON.parse(s));status.textContent=slot+" phase loaded."}
function applyState(d){currentFormation=d.formation||"433";names=Array.isArray(d.names)?d.names:names;while(players.length<names.length) addPlayer();while(players.length>names.length&&players.length>11){players[players.length-1].remove();players.pop()}notes.value=d.notes||"";d.positions?.forEach((x,i)=>{if(players[i]){players[i].style.left=x.left;players[i].style.top=x.top}});arrows=Array.isArray(d.arrows)?d.arrows:[];oppositionMode=!!d.oppositionMode;if(d.ball){ballX=+d.ball.x||50;ballY=+d.ball.y||50;ball.style.left=ballX+"%";ball.style.top=ballY+"%"}sequence=Array.isArray(d.sequence)?d.sequence:sequence;renderNames();drawArrows();renderOpposition()}
function renderOpposition(){pitch.querySelectorAll(".opp").forEach(x=>x.remove());if(!oppositionMode)return;const opp=[[50,12],[20,25],[40,22],[60,22],[80,25],[30,40],[50,35],[70,40],[25,58],[50,55],[75,58]];opp.forEach((pos,i)=>{let o=document.createElement("div");o.className="player opp";o.textContent="O";o.style.left=pos[0]+"%";o.style.top=pos[1]+"%";pitch.appendChild(o)})}
function toggleOpposition(btn){oppositionMode=!oppositionMode;btn.classList.toggle("active",oppositionMode);renderOpposition();status.textContent=oppositionMode?"Opposition players shown.":"Opposition players hidden."}
function saveTactic(){localStorage.setItem("wealdstoneTactic",JSON.stringify(getState()));status.textContent="Tactic saved on this phone."}
async function shareTactic(){let data=JSON.stringify(getState());try{if(navigator.share){await navigator.share({title:"Wealdstone Tactics",text:data});status.textContent="Tactic shared."}else{throw new Error("share unavailable")}}catch(e){try{if(navigator.clipboard){await navigator.clipboard.writeText(data);status.textContent="Tactic copied to clipboard."}else{status.textContent="Share unavailable on this device."}}catch(_){status.textContent="Share unavailable on this device."}}}
function exportTactic(){let blob=new Blob([JSON.stringify(getState(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wealdstone-tactic.json";a.click();URL.revokeObjectURL(a.href);status.textContent="Tactic exported."}
function matchdayMode(btn){document.body.classList.toggle("matchday");btn.classList.toggle("active");status.textContent=document.body.classList.contains("matchday")?"Matchday mode on.":"Matchday mode off."}

function resetBoard(){snapshot();names=Array.from({length:11},(_,i)=>"Player "+(i+1));notes.value="";arrows=[];oppositionMode=false;setFormation("433",document.querySelector(".bar button"));renderNames();drawArrows();renderOpposition();status.textContent="Board reset."}
renderNames();currentFormation="433";formations["433"].forEach((pos,i)=>{players[i].style.left=pos[0]+"%";players[i].style.top=pos[1]+"%"});
window.addEventListener("load",async()=>{try{if("serviceWorker"in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs)await reg.unregister();if("caches"in window){const keys=await caches.keys();for(const key of keys)if(key.startsWith("wealdstone-tactics-"))await caches.delete(key)}}}catch(e){}});

/* SAFE STARTING XI MANAGER v1 */
(function(){
  window.openTeamManager=function(){
    let m=document.getElementById("teamManager");
    if(!m){
      m=document.createElement("div");
      m.id="teamManager";
      m.style="display:none;position:fixed;inset:3%;z-index:125;background:#111;color:#fff;border:1px solid #343b45;border-radius:14px;padding:16px;overflow:auto;text-align:left";

      box.appendChild(row);
    });
    m.style.display="block";
  };
  window.closeTeamManager=function(){const m=document.getElementById("teamManager");if(m)m.style.display="none";};

})();
