name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate site before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'id="pitch"' index.html
          grep -q 'id="ball"' index.html
          test "$(grep -o 'data-player="[0-9][0-9]*"' index.html | wc -l)" -eq 11
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          assert len(scripts) == 1, f"expected 1 inline script, found {len(scripts)}"
          Path("/tmp/app.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/app.js
          test -s pro-upgrade.js
          node --check pro-upgrade.js
          test -s ai-decision.js
          node --check ai-decision.js
      - name: Inject Coach Hub and AI upgrades
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          tags = [
              '<script src="pro-upgrade.js"></script>',
              '<script src="ai-decision.js"></script>'
          ]
          for tag in tags:
              assert tag not in html
          assert '</body>' in html
          html = html.replace('</body>', ''.join(tag + '\n' for tag in tags) + '</body>', 1)
          Path("index.html").write_text(html, encoding="utf-8")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
